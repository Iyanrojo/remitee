<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<title>Remitee</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
html{color-scheme:light}body{margin:0}[hidden]{display:none!important}
/* Layout: una sola columna estrecha tipo app móvil, barra de pestañas fija abajo, mucho aire y un único acento suave. */
:root{
  --bg:#f7f8fc; --surface:#ffffff; --ink:#22263a; --muted:#8a90a6; --line:#eceef5;
  --accent:#5b6cf0; --accent-soft:#eceefe; --ok:#2fa36b; --ok-soft:#e5f6ee; --warm:#d98a1e; --warm-soft:#fdf2e4; --bad:#d64c4c; --bad-soft:#fdeaea;
  --head:"Outfit", "Segoe UI", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141c; --surface:#1b1e29; --ink:#eceef6; --muted:#878ca3; --line:#272b3a;
  --accent:#8d99ff; --accent-soft:#252a4a; --ok:#5cc792; --ok-soft:#1d3329; --warm:#f2b46a; --warm-soft:#3a2e1f; --bad:#f08080; --bad-soft:#3b2224; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141c; --surface:#1b1e29; --ink:#eceef6; --muted:#878ca3; --line:#272b3a;
  --accent:#8d99ff; --accent-soft:#252a4a; --ok:#5cc792; --ok-soft:#1d3329; --warm:#f2b46a; --warm-soft:#3a2e1f; --bad:#f08080; --bad-soft:#3b2224; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
.app{max-width:440px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding-block:22px 18px}
.logo{font-family:var(--head);font-weight:700;font-size:1.45rem;letter-spacing:-.02em;margin:0}
.logo span{color:var(--accent)}

.logo .ebar{position:relative;display:inline-block;font-weight:inherit;padding-right:.62em}
.logo .ebar .bar{position:absolute;left:var(--bar-x,.38em);bottom:var(--bar-y,.41em);width:.5em;height:var(--bar-h,.1em);background:currentColor}
.logo .ebar .dot{position:absolute;left:.86em;bottom:calc(var(--bar-y,.41em) + var(--bar-h,.1em)/2 - .1em);width:.2em;height:.2em;border-radius:50%;background:var(--accent)}
.logo .slogan{display:block;font-family:var(--body);font-size:.68rem;font-weight:500;letter-spacing:.02em;color:var(--muted);margin-top:-2px}
.theme-btn{width:38px;height:38px;padding:0;border-radius:50%;background:var(--surface);color:var(--ink);border:1px solid var(--line);display:grid;place-items:center}
.theme-btn svg{width:18px;height:18px}
.topr{display:flex;gap:10px;align-items:center}
.demo{font-size:.7rem;font-weight:500;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
h2{font-family:var(--head);font-weight:600;font-size:1.35rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px}
button{font-family:var(--body);font-weight:600;font-size:.95rem;border:0;border-radius:999px;padding:13px 20px;cursor:pointer;background:var(--accent);color:#fff;transition:transform .12s, opacity .12s}
button:active{transform:scale(.97)}
button.soft{background:var(--accent-soft);color:var(--accent)}
button.plain{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.avatar{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-weight:600;font-size:1.1rem;color:var(--ink)}
.chip{font-size:.78rem;background:var(--bg);border:1px solid var(--line);padding:4px 11px;border-radius:999px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* Descubrir */
.card{background:var(--surface);border-radius:28px;padding:28px 24px 24px;box-shadow:0 10px 30px -18px rgba(40,50,110,.35);display:grid;gap:18px;text-align:center}
.card .avatar{width:84px;height:84px;font-size:1.7rem;margin:0 auto}
.card .name{font-family:var(--head);font-weight:600;font-size:1.4rem;margin:0}
.card .where{color:var(--muted);font-size:.85rem;margin-top:2px}
.card .bio{font-size:1rem;margin:0;color:var(--ink)}
.card .chips{justify-content:center}
.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.hint{color:var(--muted);font-size:.82rem;text-align:center;margin-top:14px}

/* Overlay match */
.overlay{position:fixed;inset:0;background:rgba(18,20,30,.45);display:grid;place-items:center;padding:20px;z-index:20}
.modal{background:var(--surface);border-radius:28px;padding:30px 24px;max-width:380px;width:100%;text-align:center;display:grid;gap:16px}
.pair{display:flex;justify-content:center}
.pair .avatar{width:68px;height:68px;font-size:1.4rem;border:4px solid var(--surface)}
.pair .avatar+.avatar{margin-left:-14px}
.modal h3{font-family:var(--head);font-weight:700;font-size:1.5rem;margin:0}

/* Lista de cartas */
.list{display:grid;gap:10px}
.item{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:var(--r);padding:14px 16px;cursor:pointer;border:0;width:100%;text-align:left;color:var(--ink);font-weight:400}
.item .txt{flex:1;min-width:0}
.item .n{font-family:var(--head);font-weight:600;font-size:1.02rem}
.item .s{color:var(--muted);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.empty{background:var(--surface);border-radius:var(--r);padding:34px 22px;text-align:center;color:var(--muted)}

/* Ventana de correspondencia */
.back{background:none;color:var(--accent);padding:4px 0;margin-bottom:10px;font-weight:600}
.chead{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.chead .n{font-family:var(--head);font-weight:600;font-size:1.25rem}
.chead .s{color:var(--muted);font-size:.84rem}
.sendto{background:var(--surface);border-radius:var(--r);padding:18px;display:grid;gap:6px;margin-bottom:18px}
.sendto .lbl{font-size:.74rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sendto .addr{font-size:.93rem}
.sendto .code{font-family:ui-monospace,Menlo,monospace;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;display:inline-block;margin-top:2px}
.timeline{display:grid;gap:10px;margin-bottom:18px}
.letter{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:12px 14px;max-width:88%}
.letter.mine{margin-left:auto;background:var(--accent-soft)}
.letter .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--bg)}
.letter.mine .ic{background:var(--surface)}
.letter .t{font-weight:600;font-size:.9rem}
.letter .d{color:var(--muted);font-size:.8rem}
.status{font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;margin-left:auto;white-space:nowrap}
.status.way{background:var(--warm-soft);color:var(--warm)}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.bigbtn{width:100%;padding:16px;font-size:1rem}
.note{color:var(--muted);font-size:.82rem;text-align:center;margin-top:10px}

/* Perfil */
.form{display:grid;gap:14px}
.field{display:grid;gap:6px;background:var(--surface);border-radius:var(--r);padding:14px 16px}
.field label{font-size:.76rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input,textarea{font:inherit;color:var(--ink);background:transparent;border:0;padding:2px 0;width:100%;resize:vertical}
.field small{color:var(--muted);font-size:.8rem}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:10}
.tabs .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs a{display:grid;justify-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.74rem;font-weight:500;padding:6px;border-radius:12px;position:relative}
.tabs a[aria-current="page"]{color:var(--accent)}
.tabs svg{width:23px;height:23px}
.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--accent);color:#fff;font-size:.62rem;font-weight:600;min-width:17px;height:17px;border-radius:999px;display:grid;place-items:center;padding:0 4px}
/* Fotos */
.ph{flex:none;border-radius:50%;position:relative;overflow:hidden;display:grid;place-items:center;background-size:cover;background-position:center}
.ph.big{width:110px;height:110px;margin:0 auto}
.ph.md{width:68px;height:68px;border:4px solid var(--surface)}
.ph.sm{width:52px;height:52px}
.ph.locked::before{content:"";position:absolute;inset:-12px;background:inherit;filter:blur(14px)}
.ph .lock{position:relative;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;color:#2a2e45}
.ph .lock svg{width:17px;height:17px}
.ph .init{font-family:var(--head);font-weight:600;color:#2a2e45;font-size:1.2rem;position:relative}
.ph.big .init{font-size:2rem}
.phnote{font-size:.78rem;color:var(--muted);margin-top:8px}
.common{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.photo-pick{display:flex;gap:14px;align-items:center}
.photo-pick input[type=file]{font-size:.85rem}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:14px 16px}
.switch b{font-weight:600;font-size:.95rem}
.switch small{display:block;color:var(--muted);font-size:.8rem}
.switch input{width:46px;height:26px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:23px}
.sim{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;padding:12px 14px;border:1px dashed var(--line);border-radius:16px;font-size:.84rem;color:var(--muted)}
.sim b{color:var(--ink);font-weight:600}
button.sm{padding:7px 13px;font-size:.82rem}
.dl{border-radius:var(--r);padding:14px 16px;margin-bottom:14px;font-size:.88rem;display:grid;gap:3px}
.dl b{font-family:var(--head);font-weight:600;font-size:1rem}
.dl.mine{background:var(--accent-soft);color:var(--ink)} .dl.mine b{color:var(--accent)}
.dl.warn{background:var(--warm-soft);color:var(--ink)} .dl.warn b{color:var(--warm)}
.dl.them{background:var(--surface);color:var(--muted)} .dl.them b{color:var(--ink)}
.dl.bad{background:var(--bad-soft);color:var(--ink)} .dl.bad b{color:var(--bad)}
.susp{background:var(--bad-soft);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;font-size:.88rem}
.susp b{color:var(--bad)}
.item.closed{opacity:.6}
.item .s.urgent{color:var(--warm);font-weight:600}
.paywall{margin-top:16px;background:var(--surface);border-radius:var(--r);padding:20px;text-align:center;display:grid;gap:10px;border:1px solid var(--accent-soft)}
.paywall b{font-family:var(--head);font-weight:600;font-size:1.1rem}
.paywall p{margin:0;color:var(--muted);font-size:.9rem}
.paywall small{color:var(--muted);font-size:.75rem}
.about{background:var(--surface);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.about summary{cursor:pointer;font-family:var(--head);font-weight:600;font-size:1rem;list-style-position:inside}
.about p{margin:0 0 8px;font-size:.93rem}
.about small{color:var(--muted);font-size:.8rem}
.welcome{display:grid;gap:14px;text-align:center;padding-top:20px}
.welcome h2{font-size:1.7rem;line-height:1.2}
.perks{list-style:none;padding:0;margin:0 0 6px;display:grid;gap:8px;text-align:left;background:var(--surface);border-radius:var(--r);padding:16px 18px}
.perks li{padding-left:24px;position:relative;font-size:.92rem}
.perks li::before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:700}
button.google{background:var(--surface);color:var(--ink);border:1px solid var(--line);width:100%;padding:15px}
.gsim{background:var(--surface);border-radius:var(--r);padding:16px}
.gsim .field{padding:0;background:transparent}
.gsim input{border-bottom:1px solid var(--line);padding:8px 0}
.verified{display:flex;gap:12px;align-items:center;background:var(--ok-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.verified b{display:block;font-size:.92rem;color:var(--ok)}
.verified small{color:var(--muted);font-size:.8rem}
.vdot{width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.wmodal{text-align:left;gap:12px;max-height:calc(100% - 20px);overflow:auto}
.wtop{display:grid;gap:8px}
.wstep{font-size:.75rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.wbar{height:5px;background:var(--line);border-radius:999px;overflow:hidden}
.wbar span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.wdesc{margin:0;color:var(--muted);font-size:.92rem}
.wfields{display:grid;gap:10px}
.wfields .field{background:var(--bg)}
.wbtns{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.wphoto{display:grid;justify-items:center;gap:12px;padding:6px 0}
.filebtn{font-weight:600;font-size:.9rem;color:var(--accent);background:var(--accent-soft);padding:9px 16px;border-radius:999px;cursor:pointer}
.wfields .switch{background:var(--bg)}
.sel{font:inherit;color:var(--ink);background:transparent;border:0;padding:2px 0}
.lockline{font-size:.85rem;color:var(--ink);background:var(--ok-soft);border-radius:14px;padding:10px 12px}
.wbg{opacity:.5}
.flow{display:grid;gap:8px}
.flow svg{width:100%;height:auto;display:block}
.fl-line{stroke:var(--line);stroke-width:2;stroke-dasharray:4 5;fill:none}
.fl-arc{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 5;fill:none;opacity:0;transition:opacity .4s}
.fl-arc.show{opacity:.7}
.fl-me{fill:var(--accent)} .fl-them{fill:#ffe3d6}
.fl-init{font-family:var(--head);font-weight:600;font-size:13px;text-anchor:middle;fill:#2a2e45}
.fl-node:first-of-type .fl-init{fill:#fff}
.fl-off{fill:var(--accent-soft)} .fl-house{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
#fl-office{transition:opacity .4s} #fl-office.dim{opacity:.3}
.fl-lbl{font-size:11px;text-anchor:middle;fill:var(--muted);font-family:var(--body)}
.fl-envr{fill:var(--surface);stroke:var(--ink);stroke-width:1.6} .fl-envf{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.fl-txt{margin:0;min-height:3.1em;font-size:.92rem;text-align:center;color:var(--ink)}
.fl-dots{display:flex;justify-content:center;gap:6px}
.fl-dots span{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .3s,width .3s}
.fl-dots span.on{background:var(--accent);width:18px;border-radius:999px}
.flowcard{background:var(--surface);border-radius:var(--r);padding:14px 14px 12px}
.linkbtn{background:none;color:var(--accent);padding:4px 0 0;font-size:.85rem;justify-self:start}
.share{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.share b{font-weight:600;font-size:.95rem}
.share small{display:block;color:var(--muted);font-size:.8rem}
.agecheck{display:flex;gap:10px;align-items:center;font-size:.9rem;padding:4px 2px}
.agecheck input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.helpbtn{background:var(--accent-soft);color:var(--accent);padding:8px 13px;font-size:.8rem}
.art{display:grid;gap:4px;padding-bottom:10px}
.art-kicker{font-size:.74rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.art h2{font-size:1.6rem;margin-bottom:6px}
.art-lede{font-size:1.02rem;margin:0 0 14px;color:var(--ink)}
.art .flowcard{margin-bottom:10px}
.art h3{font-family:var(--head);font-weight:600;font-size:1.08rem;margin:18px 0 2px}
.art p{margin:0;color:var(--ink);max-width:62ch}
.code-inline{font-family:ui-monospace,Menlo,monospace;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:5px;font-size:.9em}
.views{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;color:var(--muted);margin-bottom:10px}
.vbar{display:flex;gap:4px}
.vbar i{width:18px;height:4px;border-radius:999px;background:var(--line)}
.vbar i.used{background:var(--muted)}
.vbar i.now{background:var(--accent)}
.backp{background:none;color:var(--accent);padding:4px 0;font-size:.85rem;font-weight:600}
.backp:disabled{color:var(--muted);opacity:.5}
.trust{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:.78rem}
.trust.sm{justify-content:flex-start;margin-top:4px}
.tcount{color:var(--ink);font-weight:500}
.tok{color:var(--ok);background:var(--ok-soft);padding:1px 8px;border-radius:999px;font-weight:500}
.tnew{color:var(--warm);background:var(--warm-soft);padding:1px 9px;border-radius:999px;font-weight:600}
.whofirst{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:.88rem;color:var(--muted);display:grid;gap:2px}
.whofirst b{color:var(--ink);font-family:var(--head);font-weight:600;font-size:.98rem}
.whofirst.me{background:var(--accent-soft);border-color:transparent} .whofirst.me b{color:var(--accent)}
.lcard{background:var(--surface);border-radius:16px;padding:12px 14px;display:grid;gap:10px;max-width:94%}
.lcard.mine{margin-left:auto;background:var(--accent-soft)}
.lhead{display:flex;gap:12px;align-items:center}
.lhead .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--bg)}
.lcard.mine .lhead .ic{background:var(--surface)}
.lhead .t{font-weight:600;font-size:.9rem} .lhead .d{color:var(--muted);font-size:.8rem}
.lhead .thumb{margin-left:auto}
.thumb{width:40px;height:40px;border-radius:10px;background:var(--bg) center/cover;display:grid;place-items:center;color:var(--accent);flex:none;border:1px solid var(--line)}
.thumb.big{width:64px;height:64px;font-size:1.4rem}
.phases{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.phases li{border-top:3px solid var(--line);padding-top:6px;font-size:.7rem;color:var(--muted);display:grid;gap:1px;min-width:0}
.phases li span{font-weight:600;line-height:1.2}
.phases li.done{border-color:var(--ok);color:var(--ink)}
.phases li.now{border-color:var(--accent);color:var(--accent)}
.lcard [data-arrived]{justify-self:start}
.checklist{margin:0;padding-left:20px;display:grid;gap:6px;font-size:.88rem}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:999px;padding:4px;gap:4px}
.seg button{background:transparent;color:var(--muted);padding:8px 10px;font-size:.85rem}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(30,40,90,.12)}
.prep{display:grid;gap:8px}

async function cloudLoad(uid){

const FIRST_DAYS = 7, REPLY_DAYS = 14, POST_DAYS = 3, SUSPEND_DAYS = 3;

const addD = (d,n) => new Date(+d + n*DAY);
const daysLeft = d => Math.max(0, Math.ceil((d - now)/DAY));
const replyAfter = {1:4, 3:null, 4:6};
const VIEW_LIMIT = 5; let viewsUsed = 0, viewDay = now.toDateString(), plus = false;

/* ---- Cartas: fases de cada envío ---- */
const PHASES = () => [L("Enviada","Sent"), L("En la oficina","At our office"), L("Reenviada","Forwarded"), L("Entregada","Delivered")];
function newLetter(mine, at){ return {mine, at, due:{office:addD(at,2), forwarded:addD(at,3), delivered:addD(at,5)}, confirmedAt:null, photo:null}; }
function stage(l){
  let k = 0; if (now >= l.due.office) k = 1; if (now >= l.due.forwarded) k = 2;
  if (l.mine ? now >= l.due.delivered : (l.confirmedAt || now >= addD(l.due.delivered, 2))) k = 3;
  return k;
}
const phaseDate = (l,k) => [l.at, l.due.office, l.due.forwarded, l.confirmedAt || (l.mine ? l.due.delivered : addD(l.due.delivered,2))][k];
const incoming = c => c.letters.find(l => !l.mine && stage(l) < 3);

function tick(){
  people.forEach(p => {
    if (p.myYes && p.matchAt && !p.matched && now >= p.matchAt){
      p.matched = true;
      chats.unshift({p, letters:[], unread:true, turn:"them", firstByThem:true, deadline:addD(p.matchAt, FIRST_DAYS), replyAt:addD(p.matchAt, 2), closed:null});

      matchModal(p, false);
    }
  });
  chats.forEach(c => {
    if (c.closed) return;
    if (c.turn==="them" && c.replyAt && now >= c.replyAt){
      const l = newLetter(false, c.replyAt); c.letters.push(l);
      c.turn = "me"; c.deadline = addD(l.due.delivered, 2 + REPLY_DAYS); c.replyAt = null; c.unread = true;
      notify(`${c.p.alias} te ha escrito una carta. Va de camino a nuestra oficina.`, `${c.p.alias} has written you a letter. It's on its way to our office.`);
    }

      else { c.closed="them"; c.unread = true; c.p.ghosts = (c.p.ghosts||0) + 1;

    }
  });

const PHASE_MSG = {
  mine: [null,
    n=>[`Tu carta está en nuestra oficina. Se la enviaremos a ${n}.`,`Your letter is at our office. We'll send it on to ${n}.`],
    n=>[`Hemos enviado tu carta a ${n}.`,`We've sent your letter to ${n}.`],
    n=>[`Tu carta ha llegado a ${n}.`,`Your letter has reached ${n}.`]],
  theirs: [null,
    n=>[`La carta de ${n} está en nuestra oficina. Te la enviaremos en breve.`,`${n}'s letter is at our office. We'll send it to you shortly.`],
    n=>[`Te hemos enviado la carta de ${n}.`,`We've sent you ${n}'s letter.`],
    n=>[`La carta de ${n} debería estar ya en tu buzón.`,`${n}'s letter should be in your mailbox by now.`]]
};
function checkPhases(c){
  c.letters.forEach(l => { const k = stage(l); if (l.ls == null) l.ls = 0;
    while (l.ls < k){ l.ls++; const m = PHASE_MSG[l.mine?"mine":"theirs"][l.ls](c.p.alias); notify(m[0], m[1]);
      // Simulación: cuando tu carta llega, la otra persona la valora

        notify(`${c.p.alias} ha valorado tu carta: ${l.ratedByThem} de 5 cartas.`, `${c.p.alias} rated your letter: ${l.ratedByThem} out of 5 letters.`); } } });
}

function deadlineBox(c){
  if (c.closed==="me") return `<div class="dl bad"><b>${L("Correspondencia cerrada","Correspondence closed")}</b>${L(`No enviaste tu carta a tiempo. Tu cuenta ha quedado suspendida ${SUSPEND_DAYS} días.`,`You didn't send your letter in time. Your account has been suspended for ${SUSPEND_DAYS} days.`)}</div>`;
  if (c.closed==="them") return `<div class="dl bad"><b>${L("Correspondencia cerrada","Correspondence closed")}</b>${L(`${esc(c.p.alias)} no escribió en su plazo. Su cuenta queda suspendida. Tú no pierdes nada.`,`${esc(c.p.alias)} didn't write within their deadline. Their account is suspended. You lose nothing.`)}</div>`;
  const d = daysLeft(c.deadline), inc = incoming(c);
  if (inc) return `<div class="dl them"><b>${L(`${esc(c.p.alias)} te ha escrito`,`${esc(c.p.alias)} has written to you`)}</b>${L(`Su carta va de camino. Cuando te llegue tendrás ${REPLY_DAYS} días para responder.`,`Their letter is on its way. Once it arrives you'll have ${REPLY_DAYS} days to reply.`)}</div>`;
  if (c.turn==="me"){
    const first = !c.letters.length;
    return `<div class="dl ${d<=2?"warn":"mine"}"><b>${first?L("Te toca escribir primero","You write first"):L("Te toca escribir","Your turn to write")}</b>${first?L("Completaste el match. ","You completed the match. "):""}${L(`Quedan ${d} ${d===1?"día":"días"}, hasta el ${fmt(c.deadline)}. Si no la envías a tiempo, la correspondencia se cierra y tu cuenta queda suspendida ${SUSPEND_DAYS} días.`,`${d} ${d===1?"day":"days"} left, until ${fmt(c.deadline)}. If you don't send it in time, the correspondence closes and your account is suspended for ${SUSPEND_DAYS} days.`)}</div>`;
  }
  if (!c.letters.length) return `<div class="dl them"><b>${L(`${esc(c.p.alias)} escribe primero`,`${esc(c.p.alias)} writes first`)}</b>${L(`Completó el match, así que tiene hasta el ${fmt(c.deadline)} para enviarte la primera carta. Tú solo tienes que esperar.`,`They completed the match, so they have until ${fmt(c.deadline)} to send you the first letter. You just have to wait.`)}</div>`;
  const l = c.letters[c.letters.length-1], k = stage(l);
  return `<div class="dl them"><b>${L(`Le toca a ${esc(c.p.alias)}`,`${esc(c.p.alias)}'s turn`)}</b>${k===0?L("Tu plazo queda en pausa hasta que la carta llegue a nuestra oficina.","Your deadline is paused until the letter reaches our office."):k<3?L("Tu carta ya está en nuestras manos. Plazo cumplido.","Your letter is in our hands. Deadline met."):L(`Tu carta ya ha llegado. Tiene hasta el ${fmt(c.deadline)} para responder.`,`Your letter has arrived. They have until ${fmt(c.deadline)} to reply.`)}</div>`;
}

function rateBox(c, l, i){
  if (l.mine || stage(l) < 3) return "";
  if (l.rated) return `<div class="ratebox done">${L("Tu valoración","Your rating")}: ${ratingHTML(l.rated, 1, {sm:true}).replace(/<span class="r-txt">.*?<\/span>/, `<span class="r-txt">${l.rated} ${L("de 5","of 5")}</span>`)}</div>`;
  return `<div class="ratebox"><span>${L("Valora esta carta","Rate this letter")}</span><span class="rate-pick" role="group" aria-label="${L("De 1 a 5 cartas","From 1 to 5 letters")}">${[1,2,3,4,5].map(v=>`<button type="button" class="rp" data-rate="${i}" data-v="${v}" aria-label="${v} ${L(v===1?"carta":"cartas",v===1?"letter":"letters")}">${ENV_SVG}</button>`).join("")}</span></div>`;
}

function letterCard(c, l, i){
  const k = stage(l), isLast = i === c.letters.length-1, PH = PHASES();
  return `<div class="lcard ${l.mine?"mine":""}">
    <div class="lhead"><div class="ic">✉︎</div><div><div class="t">${l.mine?L("Tu carta","Your letter"):L(`Carta de ${esc(c.p.alias)}`,`Letter from ${esc(c.p.alias)}`)}</div><div class="d">${PH[k]} · ${fmt(phaseDate(l,k))}</div></div>
      ${l.photo?`<div class="thumb" ${l.photo==="example"?"":`style="background-image:url('${l.photo}')"`} title="${L("Foto del sobre","Envelope photo")}">${l.photo==="example"?"✉︎":""}</div>`:""}</div>
    ${isLast||k<3?`<ol class="phases">${PH.map((ph,j)=>`<li class="${j<k?"done":j===k?"now":""}"><span>${ph}</span><small>${j<=k?fmt(phaseDate(l,j)):""}</small></li>`).join("")}</ol>`:""}
    ${!l.mine && k===2?`<button class="soft sm" data-arrived="${i}">${L("Ya me ha llegado","It has arrived")}</button>`:""}
    ${l.mine && l.ratedByThem?`<div class="ratebox done">${L(`${esc(c.p.alias)} la ha valorado`,`${esc(c.p.alias)} rated it`)}: ${ratingHTML(l.ratedByThem,1,{sm:true}).replace(/<span class="r-txt">.*?<\/span>/, `<span class="r-txt">${l.ratedByThem} ${L("de 5","of 5")}</span>`)}</div>`:""}
    ${rateBox(c, l, i)}
  </div>`;
}

function ventana(c){
  c.unread = false; badge();
  const inc = incoming(c);
  const canSend = !c.closed && c.turn==="me" && !inc;
  $("#view").innerHTML = `<button class="back" id="back">← ${L("Cartas","Letters")}</button>
    <div class="chead">${photo(c.p,"md",true)}<div><div class="n">${esc(c.p.alias)}</div><div class="s">${esc(c.p.prof)} · ${esc(c.p.zona)}</div><div class="rate-row sm">${ratingHTML(c.p.rAvg, c.p.rN, {sm:true})}</div><div class="trust sm">${trust(c.p)}</div></div></div>
    <details class="about" ${c.letters.length?"":"open"}><summary>${L(`Sobre ${esc(c.p.alias)}`,`About ${esc(c.p.alias)}`)}</summary>
      <div class="chips" style="margin:10px 0">${c.p.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>
      <p>${esc(c.p.long || c.p.bio)}</p><small>${esc(c.p.edad)} ${L("años","years old")} · ${L("Escribe desde","Writes from")} ${esc(c.p.zona)}</small></details>
    ${deadlineBox(c)}
    ${c.closed?"":(c.meReveal&&c.themReveal
      ? `<div class="sendto"><span class="lbl">${L("Direcciones compartidas","Addresses shared")}</span><span class="addr">${L("Ya podéis escribiros directamente.","You can now write to each other directly.")}</span><span class="addr"><b>${esc(c.p.alias)}:</b> ${L("dirección de ejemplo","example address")}, ${esc(c.p.zona)}</span></div>`
      : `<div class="sendto"><span class="lbl">${L("Sobre interior","Inner envelope")}</span><span>${L("Solo el código","Just the code")}: <span class="code">${esc(c.p.code)}</span></span><span class="lbl" style="margin-top:8px">${L("Sobre exterior","Outer envelope")}</span><span class="addr">${esc(CENTRAL)}</span><button class="linkbtn" id="howflow">${L("¿Cómo funciona?","How does it work?")}</button></div>`)}
    <div class="timeline">${c.letters.length ? c.letters.map((l,i)=>letterCard(c,l,i)).join("")
      : `<div class="empty" style="padding:24px">${L("Todavía no hay cartas.","No letters yet.")}<br>${c.turn==="me"?L("Escribe la primera y prepárala con el doble sobre.","Write the first one and prepare it with the double envelope."):L(`Esperando la primera carta de ${esc(c.p.alias)}.`,`Waiting for ${esc(c.p.alias)}'s first letter.`)}</div>`}</div>
    ${c.closed?"":`<button class="bigbtn" id="sent" ${canSend?"":"disabled"}>${canSend?(c.letters.length?L("Ya he enviado mi respuesta","I've sent my reply"):L("Ya he enviado la primera carta","I've sent the first letter")):inc?L(`Esperando la carta de ${esc(c.p.alias)}`,`Waiting for ${esc(c.p.alias)}'s letter`):c.turn==="them"&&!c.letters.length?L(`${esc(c.p.alias)} escribe primero`,`${esc(c.p.alias)} writes first`):L("Carta enviada ✓","Letter sent ✓")}</button>
    <p class="note">${canSend?L("Te pediremos una foto del sobre interior cerrado.","We'll ask for a photo of the sealed inner envelope."):c.turn==="them"?L("Te avisaremos en cada paso del recorrido.","We'll notify you at every step of the journey."):""}</p>`}
    ${c.closed||!c.letters.length?"":`<div class="share"><div><b>${L("Compartir direcciones","Share addresses")}</b><small>${c.meReveal&&c.themReveal?L("Hecho. Las cartas ya no pasan por nuestra oficina.","Done. Letters no longer go through our office."):c.meReveal?L(`Esperando a que ${esc(c.p.alias)} también acepte.`,`Waiting for ${esc(c.p.alias)} to accept too.`):L("Solo se comparten si los dos aceptáis. Nadie sabe si el otro ha dicho que no.","They're only shared if you both accept. Nobody knows if the other said no.")}</small></div>
      ${c.meReveal&&c.themReveal?"":`<button class="${c.meReveal?"plain":"soft"} sm" id="share">${c.meReveal?L("Retirar","Withdraw"):L("Aceptar","Accept")}</button>`}</div>`}
    ${sim()}`;
  $("#back").onclick = () => { openId = null; cartas(); };
  const hf = $("#howflow"); if (hf) hf.onclick = showFlow;
  document.querySelectorAll("[data-arrived]").forEach(b => b.onclick = () => { const l = c.letters[+b.dataset.arrived]; l.confirmedAt = now; l.ls = 3;
    c.deadline = addD(now, REPLY_DAYS); toast(L(`Carta marcada como recibida. Tienes ${REPLY_DAYS} días para responder`,`Letter marked as received. You have ${REPLY_DAYS} days to reply`)); ventana(c); });
  // Valorar una carta recibida
  document.querySelectorAll("[data-rate]").forEach(b => {
    const grp = [...document.querySelectorAll(`[data-rate="${b.dataset.rate}"]`)];
    b.onmouseenter = () => grp.forEach(x => x.classList.toggle("hov", +x.dataset.v <= +b.dataset.v));
    b.onmouseleave = () => grp.forEach(x => x.classList.remove("hov"));
    b.onclick = () => { const l = c.letters[+b.dataset.rate], v = +b.dataset.v; l.rated = v;
      c.p.rAvg = (c.p.rAvg * c.p.rN + v) / (c.p.rN + 1); c.p.rN += 1;
      toast(L(`Has valorado la carta de ${c.p.alias} con ${v} de 5 cartas`,`You rated ${c.p.alias}'s letter ${v} out of 5 letters`)); ventana(c); };
  });
  const sh = $("#share"); if (sh) sh.onclick = () => { c.meReveal = !c.meReveal;
    if (c.meReveal && replyAfter[c.p.id] !== null) setTimeout(() => { if (c.meReveal){ c.themReveal = true; toast(L(`${c.p.alias} también ha aceptado compartir direcciones`,`${c.p.alias} has also agreed to share addresses`)); if (openId===c.p.id) ventana(c); } }, 1800);
    if (!c.meReveal) c.themReveal = false; ventana(c); };
  bindSim();
  const btn = $("#sent"); if (btn && canSend) btn.onclick = () => sendModal(c);
}

function sendModal(c){
  let pic = null;
  const o = document.createElement("div"); o.className = "overlay";
  const render = () => {
    o.innerHTML = `<div class="modal wmodal" role="dialog" aria-label="${L("Enviar carta","Send letter")}">
      <h3 style="font-size:1.25rem">${L("Prepara y envía tu carta","Prepare and send your letter")}</h3>
      <div class="flowcard">${prepHTML(c.p)}</div>
      <ol class="checklist">
        <li>${L(`Carta dentro de un <b>sobre interior</b> cerrado, con solo el código <span class="code-inline">${esc(c.p.code)}</span>.`,`Letter inside a sealed <b>inner envelope</b>, with only the code <span class="code-inline">${esc(c.p.code)}</span>.`)}</li>
        <li>${L("Ese sobre y <b>un segundo sello</b>, dentro del <b>sobre exterior</b>.","That envelope and <b>a second stamp</b>, inside the <b>outer envelope</b>.")}</li>
        <li>${L(`Sobre exterior dirigido a <b>${esc(CENTRAL)}</b>, con su sello.`,`Outer envelope addressed to <b>${esc(CENTRAL)}</b>, with its own stamp.`)}</li>
      </ol>
      <div class="field" style="background:var(--bg)"><label>${L("Foto del sobre interior cerrado","Photo of the sealed inner envelope")}</label>
        <div class="photo-pick">${pic?`<div class="thumb big" ${pic==="example"?"":`style="background-image:url('${pic}')"`}>${pic==="example"?"✉︎":""}</div>`:""}
          <label class="filebtn" for="s-p">${pic?L("Cambiar foto","Change photo"):L("Hacer o subir foto","Take or upload a photo")}</label><input type="file" id="s-p" accept="image/*" capture="environment" hidden>
          ${pic?"":`<button class="linkbtn" id="s-ex">${L("Usar foto de ejemplo","Use an example photo")}</button>`}</div>
        <small>${L(`Que se vea el código ${esc(c.p.code)}. Con la foto, tu plazo queda en pausa hasta que la carta llegue a nuestra oficina.`,`Make sure the code ${esc(c.p.code)} is visible. With the photo, your deadline is paused until the letter reaches our office.`)}</small></div>
      <div class="wbtns"><button class="plain" id="s-x">${L("Cancelar","Cancel")}</button><button id="s-ok" ${pic?"":"disabled"}>${L("Confirmar envío","Confirm sending")}</button></div></div>`;
    startPrep(o);
    o.querySelector("#s-p").onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { pic = r.result; render(); }; r.readAsDataURL(f); };
    const ex = o.querySelector("#s-ex"); if (ex) ex.onclick = () => { pic = "example"; render(); };
    o.querySelector("#s-x").onclick = () => o.remove();
    o.querySelector("#s-ok").onclick = () => {
      const l = newLetter(true, now); l.photo = pic; c.letters.push(l); c.turn = "them";
      c.deadline = addD(l.due.delivered, REPLY_DAYS);
      const ra = c.p.id in replyAfter ? replyAfter[c.p.id] : 5; c.replyAt = ra==null ? null : addD(l.due.delivered, ra);
      l.ls = 0; o.remove(); notify(`Has enviado tu carta para ${c.p.alias}. Te avisaremos cuando llegue a nuestra oficina.`,`You've sent your letter to ${c.p.alias}. We'll let you know when it reaches our office.`); ventana(c);
    };
  };
  document.body.appendChild(o); render();
}

    <button type="button" class="sm" data-pp="1">${L("Siguiente","Next")}</button></div></div>`;

function startPrep(root){
  const box = root && root.querySelector(".prep"); if (!box) return;
  const scenes = [...box.querySelectorAll(".sc")], dots = [...box.querySelectorAll(".dotb")], txt = box.querySelector("#pp-txt");
  const prev = box.querySelector('[data-pp="-1"]'), next = box.querySelector('[data-pp="1"]');
  const P = PREP(); let i = 0;
  const label = () => L(`Paso ${i+1} de ${P.length}. `,`Step ${i+1} of ${P.length}. `) + P[i];
  const show = () => {
    scenes.forEach((s,j)=>s.classList.toggle("on", j===i)); dots.forEach((d,j)=>d.classList.toggle("on", j===i));
    txt.classList.add("fade"); setTimeout(() => { txt.textContent = label(); txt.classList.remove("fade"); }, 350);
    prev.disabled = i === 0; next.textContent = i === P.length-1 ? L("Volver a empezar","Start again") : L("Siguiente","Next");
  };
  prev.onclick = () => { if (i > 0){ i--; show(); } };
  next.onclick = () => { i = i === P.length-1 ? 0 : i+1; show(); };
  dots.forEach((d,j) => d.onclick = () => { i = j; show(); });
  txt.textContent = label(); show();
}

/* ---- Perfil propio: se guarda en este navegador ---- */
function saveLocal(){ try { localStorage.setItem("remitee-me", JSON.stringify(me)); } catch(e) { try { const c = {...me, foto:null}; localStorage.setItem("remitee-me", JSON.stringify(c)); } catch(_){} } }
function saveMe(){ saveLocal(); if (FB && me.uid) cloudSave().catch(e => toast(L("No se ha podido guardar en la nube. Revisa tu conexión.","Couldn't save to the cloud. Check your connection."))); }
function loadMe(){ try { const d = JSON.parse(localStorage.getItem("remitee-me")||"null"); if (d) Object.assign(me, d); } catch(e) {} }
const RANGES = ["25–30","30–35","35–40","40–45","45–50","50–55","55–60","60+"];
function newCode(){ const w=["MAR","LUNA","RIO","SOL","PINO","ALBA","NIDO","ROCA"]; return `${w[Math.floor(Math.random()*w.length)]}-${1000+Math.floor(Math.random()*9000)}`; }
const G_OPTS = () => [["f",L("En femenino","Feminine")],["m",L("En masculino","Masculine")],["n",L("Neutro","Neutral")]];

function profileFields(){
  return `
    <div class="field"><label for="f-p">${L("Foto","Photo")}</label><div class="photo-pick">${myPhoto("sm")}<input type="file" id="f-p" accept="image/*"></div><small>${L("Opcional. Nadie la ve antes del match.","Optional. Nobody sees it before a match.")}</small></div>
    <label class="switch" for="f-s"><span><b>${L("Mostrar mi foto tras el match","Show my photo after a match")}</b><small>${L("Si lo desactivas, solo verán tu inicial.","If you turn it off, they'll only see your initial.")}</small></span><input type="checkbox" id="f-s" ${me.showFoto?"checked":""}></label>

    <div class="field"><label for="f-e">${L("Edad","Age")} *</label><select id="f-e" class="sel">${RANGES.map(r=>`<option ${r===me.edad?"selected":""}>${r}</option>`).join("")}</select><small>${L("Se muestra como rango, nunca la edad exacta.","Shown as a range, never your exact age.")}</small></div>

function flowHTML(){

  </svg>

  <div class="fl-dots">${F.map((_,i)=>`<span data-i="${i}"></span>`).join("")}</div></div>`;

let flowRaf = 0;
function startFlow(root){
  cancelAnimationFrame(flowRaf);
  if (!root) return;
  const F = FLOW(), X = [40,170,300], env = root.querySelector("#fl-env"), txt = root.querySelector("#fl-txt");
  if (!env) return;
  const dots = [...root.querySelectorAll(".fl-dots span")], office = root.querySelector("#fl-office"), arc = root.querySelector("#fl-arc");
  const reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  const MOVE = 1800, HOLD = 1300, PH = MOVE + HOLD; let t0 = performance.now(), last = -1;
  const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
  function frame(t){
    if (!root.isConnected || !env.isConnected) return;
    const el = Math.max(0, t - t0), i = Math.floor(el / PH) % F.length, f = F[i];
    const k = reduce ? 1 : ease(Math.min(1, (el % PH) / MOVE));
    const x = X[f.from] + (X[f.to]-X[f.from])*k, y = f.direct ? 70 - Math.sin(Math.PI*k)*42 : 70;
    env.setAttribute("transform", `translate(${x} ${y})`);
    if (i !== last){ last = i; txt.textContent = f.txt; dots.forEach((d,j)=>d.classList.toggle("on", j===i));
      office.classList.toggle("dim", !!f.direct); arc.classList.toggle("show", !!f.direct); }
    flowRaf = requestAnimationFrame(frame);
  }
  flowRaf = requestAnimationFrame(frame);
}

   f:()=>`<div class="field"><label for="w-b">${L("Biografía breve","Short bio")}</label><textarea id="w-b" rows="3" maxlength="200" placeholder="${L("Escribo mejor de lo que hablo...","I write better than I talk...")}">${esc(me.bio)}</textarea><small><span id="w-bc">${me.bio.length}</span>/200</small></div>
     <div class="field"><label for="w-i">${L("3 intereses","3 interests")}</label><input id="w-i" value="${esc(me.intereses)}" placeholder="${L("cine, montaña, poesía","film, hiking, poetry")}"><small>${L("Separados por comas. Sirven para hacer match.","Separated by commas. Used for matching.")}</small></div>`,
   bind:()=>{ $("#w-b").oninput = e => $("#w-bc").textContent = e.target.value.length; },
   save:()=>{ me.bio=$("#w-b").value.trim(); me.intereses=$("#w-i").value.split(",").map(x=>x.trim()).filter(Boolean).slice(0,3).join(", ");
     return !me.bio ? L("Escribe una biografía breve","Write a short bio") : me.intereses.split(",").filter(Boolean).length<3 ? L("Añade 3 intereses separados por comas","Add 3 interests separated by commas") : ""; }},
  {t:L("Una biografía extensa","A long bio"), d:L("Solo la leerán las personas con las que hagas match. Cuéntate con calma: qué haces, qué te gusta, qué buscas.","Only your matches will read it. Take your time: what you do, what you like, what you're looking for."),
   f:()=>`<div class="field"><label for="w-l">${L("Biografía extensa","Long bio")}</label><textarea id="w-l" rows="6" maxlength="800" placeholder="${L("Cuéntate con más calma...","Tell your story at your own pace...")}">${esc(me.long)}</textarea><small><span id="w-lc">${me.long.length}</span>/800</small></div>`,
   bind:()=>{ $("#w-l").oninput = e => $("#w-lc").textContent = e.target.value.length; },
   save:()=>{ me.long=$("#w-l").value.trim(); return ""; }},
  {t:L("Tu dirección","Your address"), d:L("Es imprescindible. Nadie tiene acceso a ella: nosotros la usamos solo para reenviarte las cartas que te escriban.","It's essential. Nobody else has access to it: we only use it to forward the letters people write to you."),
   f:()=>`<div class="field"><label for="w-d">${L("Dirección postal","Postal address")}</label><textarea id="w-d" rows="3" placeholder="${L("Calle, número, piso&#10;Código postal y ciudad","Street, number, flat&#10;Postcode and city")}">${esc(me.dir||"")}</textarea></div>
     <div class="lockline">🔒 ${L("Las otras personas solo verán tu código de buzón, nunca tu dirección.","Other people will only see your mailbox code, never your address.")}</div>`,
   save:()=>{ me.dir=$("#w-d").value.trim(); return me.dir.length<8 ? L("La dirección es imprescindible para recibir cartas","An address is essential to receive letters") : ""; }},
  {t:L("Así se envía una carta","How to send a letter"), d:L("Doble sobre y dos sellos: uno para que nos llegue y otro para que la reenviemos. Tu carta nunca se abre.","Two envelopes and two stamps: one to reach us and one for us to forward it. Your letter is never opened."),
   f:()=>`<div class="flowcard">${prepHTML()}</div>`,
   bind:()=>startPrep(document.querySelector(".overlay.wiz")),
   save:()=>""}
];
function wizard(){
  const WW = W(), st = WW[wStep], last = wStep === WW.length-1;
  $("#view").innerHTML = `<div class="wbg"><div class="verified"><span class="vdot">✓</span><div><b>${L("Cuenta verificada","Account verified")}</b><small>${esc(me.email)}</small></div></div><h2>${L("Crea tu perfil","Create your profile")}</h2><p class="sub">${L("Te guiamos paso a paso.","We'll guide you step by step.")}</p></div>`;
  document.querySelector(".overlay.wiz")?.remove();
  const o = document.createElement("div"); o.className = "overlay wiz";
  o.innerHTML = `<div class="modal wmodal" role="dialog" aria-labelledby="wt">
    <div class="wtop"><span class="wstep">${L(`Paso ${wStep+1} de ${WW.length}`,`Step ${wStep+1} of ${WW.length}`)}</span><div class="wbar"><span style="width:${(wStep+1)/WW.length*100}%"></span></div></div>
    <h3 id="wt">${st.t}</h3><p class="wdesc">${st.d}</p>
    <div class="wfields">${st.f()}</div>
    <div class="wbtns">${wStep>0?`<button class="plain" id="wb">${L("Atrás","Back")}</button>`:"<span></span>"}
      <span class="row">${st.skip?`<button class="soft" id="wsk">${st.skip}</button>`:""}<button id="wn">${last?L("Crear perfil","Create profile"):L("Siguiente","Next")}</button></span></div></div>`;
  document.body.appendChild(o);
  st.bind && st.bind();
  const first = o.querySelector("input:not([type=file]):not([type=checkbox]),textarea"); if (first) first.focus();
  o.querySelector("#wn").onclick = () => { const err = st.save(); if (err){ toast(err); return; }
    if (!last){ wStep++; wizard(); return; }
    o.remove(); me.created = true; me.code = me.code || newCode(); saveMe(); altaStep = 0; wStep = 0; document.body.classList.remove("wide"); location.hash = "#descubrir"; route(); toast(L(`Perfil creado. Tu código de buzón es ${me.code}`,`Profile created. Your mailbox code is ${me.code}`)); };
  const sk = o.querySelector("#wsk"); if (sk) sk.onclick = () => { st.save(); wStep++; wizard(); };
  const bk = o.querySelector("#wb"); if (bk) bk.onclick = () => { st.save(); wStep--; wizard(); };
  o.addEventListener("keydown", e => { if (e.key==="Enter" && e.target.tagName==="INPUT") { e.preventDefault(); o.querySelector("#wn").click(); } });
}

function como(){
  const S = (es, en) => `<p>${L(es, en)}</p>`;
  $("#view").innerHTML = `<button class="back" id="back">← ${L("Volver","Back")}</button>
  <article class="art">
    <span class="art-kicker">${L("Guía","Guide")}</span>
    <h2>${L("Cómo funciona Remitee","How Remitee works")}</h2>
    <p class="art-lede">${L("Remitee pone en contacto a personas que quieren escribirse cartas en papel. La app sirve para encontraros; la relación ocurre por correo postal, sin chat y sin prisas.","Remitee connects people who want to write each other paper letters. The app is for finding each other; the relationship happens by post, with no chat and no rush.")}</p>
    <div class="flowcard">${flowHTML()}</div>
    <h3>${L("1. Tu perfil","1. Your profile")}</h3>
    ${S("Te registras con Google para verificar que eres una persona real. Remitee es solo para mayores de 25 años. Tu perfil tiene un alias, un rango de edad, desde dónde escribes, tu profesión, una biografía breve y 3 intereses. Tu email nunca se muestra.","You sign up with Google to verify that you're a real person. Remitee is for over 25s only. Your profile has an alias, an age range, where you write from, your occupation, a short bio and 3 interests. Your email is never shown.")}
    <h3>${L("2. Match por intereses","2. Matching on interests")}</h3>
    ${S(`En Descubrir lees perfiles sin ver fotos. Puedes elegir a alguien o pasar. Si los dos os elegís, hay match y se abre la correspondencia. Cada día puedes ver ${VIEW_LIMIT} perfiles; con Remitee Plus no hay límite.`,`In Discover you read profiles without seeing photos. You can choose someone or pass. If you both choose each other, it's a match and the correspondence opens. Each day you can see ${VIEW_LIMIT} profiles; with Remitee Plus there's no limit.`)}
    <h3>${L("3. Lo que se desbloquea con el match","3. What a match unlocks")}</h3>
    ${S("Tras el match puedes ver la foto de la otra persona, si ha decidido mostrarla, y su biografía extensa, que solo leen sus matches.","After a match you can see the other person's photo, if they've chosen to show it, and their long bio, which only their matches can read.")}
    <h3>${L("4. Quién escribe primero","4. Who writes first")}</h3>
    ${S("Escribe primero quien completa el match, es decir, quien dice que sí en segundo lugar. La app lo indica en la pantalla del match, así nunca se cruzan dos cartas ni os quedáis esperando el uno al otro.","Whoever completes the match writes first, that is, whoever says yes second. The app shows it on the match screen, so two letters never cross and nobody is left waiting for the other.")}
    <h3>${L("5. Cómo viajan las cartas","5. How letters travel")}</h3>
    ${S("Nunca escribes a la casa de nadie. Tu carta pasa por nuestra oficina, que la reenvía a la dirección de la otra persona. Su respuesta hace el mismo camino hasta ti.","You never write to anyone's home. Your letter goes through our office, which forwards it to the other person's address. Their reply takes the same route back to you.")}
    <h3>${L("6. El doble sobre y los dos sellos","6. Two envelopes, two stamps")}</h3>
    <div class="flowcard" id="prepcard">${prepHTML()}</div>
    <p>${L(`Metes la carta en un sobre interior cerrado, con solo el código de buzón de la otra persona, por ejemplo <span class="code-inline">LUNA-4821</span>. Ese sobre, junto con un segundo sello, va dentro de un sobre exterior dirigido a Remitee y con su propio sello. En la oficina abrimos solo el sobre exterior, metemos tu sobre cerrado en uno nuevo con la dirección de la otra persona y usamos tu segundo sello para enviarlo. Nadie lee tu carta.`,`You put the letter in a sealed inner envelope, with only the other person's mailbox code, for example <span class="code-inline">LUNA-4821</span>. That envelope, together with a second stamp, goes inside an outer envelope addressed to Remitee with its own stamp. At our office we open only the outer envelope, put your sealed envelope into a new one with the other person's address, and use your second stamp to send it. Nobody reads your letter.`)}</p>
    <h3>${L("7. Seguimiento de cada carta","7. Tracking every letter")}</h3>
    <p>${L("Al enviarla, subes una foto del sobre interior cerrado. Desde ahí, las dos personas ven en qué punto está: <b>enviada</b>, <b>en la oficina</b>, <b>reenviada</b> y <b>entregada</b>, con la fecha de cada paso. La foto pone tu plazo en pausa y la llegada a la oficina lo confirma. Si una carta no llega a la oficina en unos cinco días, te avisamos antes de penalizar, por si hay un retraso de Correos. Quien la recibe confirma con un botón que le ha llegado.","When you send it, you upload a photo of the sealed inner envelope. From then on, both of you can see where it is: <b>sent</b>, <b>at our office</b>, <b>forwarded</b> and <b>delivered</b>, with the date of each step. The photo pauses your deadline and its arrival at our office confirms it. If a letter doesn't reach our office within about five days, we warn you before any penalty, in case of postal delays. The recipient confirms with a button that it has arrived.")}</p>
    <h3>${L("8. Plazos y suspensiones","8. Deadlines and suspensions")}</h3>
    ${S(`Quien escribe primero tiene ${FIRST_DAYS} días tras el match. Cada vez que recibes una carta, tienes ${REPLY_DAYS} días para responder. Si alguien no cumple su plazo, la correspondencia se cierra y su cuenta queda suspendida ${SUSPEND_DAYS} días, sin poder hacer nuevos matches.`,`Whoever writes first has ${FIRST_DAYS} days after the match. Each time you receive a letter, you have ${REPLY_DAYS} days to reply. If someone misses their deadline, the correspondence closes and their account is suspended for ${SUSPEND_DAYS} days, with no new matches.`)}
    <h3>${L("9. Valoraciones","9. Ratings")}</h3>
    ${S("Cuando te llega una carta, puedes valorarla de 0 a 5 cartas. La media aparece en el perfil de cada persona junto al número de valoraciones, para que sepas cómo de fiable y cuidadosa es como corresponsal.","When a letter reaches you, you can rate it from 0 to 5 letters. The average appears on each person's profile next to the number of ratings, so you know how reliable and thoughtful they are as a correspondent.")}
    <h3>${L("10. Tu historial","10. Your track record")}</h3>
    ${S("En cada perfil se ve cuántas correspondencias ha tenido esa persona y si responde siempre a tiempo. Quien acaba de llegar aparece como recién llegado o recién llegada. Y quien ha perdido varios matches por no responder aparece marcado como «Nunca contesta».","Each profile shows how many correspondences that person has had and whether they always reply on time. Newcomers are marked as new. And anyone who has lost several matches by not replying is marked “Never replies”.")}
    <h3>${L("11. Cuánto cuesta","11. What it costs")}</h3>
    ${S(`Usar Remitee es gratis. Cada carta lleva dos sellos que pones tú, como con cualquier carta: uno para que nos llegue y otro para reenviarla. Remitee Plus es opcional y te deja ver más de ${VIEW_LIMIT} perfiles al día.`,`Using Remitee is free. Each letter carries two stamps that you add yourself, as with any letter: one to reach us and one to forward it. Remitee Plus is optional and lets you see more than ${VIEW_LIMIT} profiles a day.`)}
    <h3>${L("12. Avisos en cada paso","12. Notifications at every step")}</h3>
    ${S("Cada vez que una carta cambia de fase te avisamos por email y en la app: cuando la envías, cuando llega a nuestra oficina, cuando la reenviamos y cuando llega a su destino. También cuando alguien te escribe, cuando hay un match o cuando se acerca un plazo. Puedes elegir los canales en tu perfil.","Every time a letter changes stage we notify you by email and in the app: when you send it, when it reaches our office, when we forward it and when it's delivered. Also when someone writes to you, when you get a match or when a deadline is near. You can choose the channels in your profile.")}
    <h3>${L("13. Compartir direcciones","13. Sharing addresses")}</h3>
    ${S("Cuando os conozcáis, podéis compartir vuestras direcciones para escribiros directamente. Solo ocurre si los dos aceptáis, y nadie sabe si el otro ha dicho que no.","Once you know each other, you can share addresses to write directly. It only happens if you both accept, and nobody knows if the other said no.")}
    <h3>${L("Tu privacidad","Your privacy")}</h3>
    ${S("Tu dirección solo la conoce Remitee y solo se usa para reenviarte cartas. No hay teléfonos ni emails en los perfiles, y puedes ocultar tu foto cuando quieras.","Only Remitee knows your address, and it's only used to forward your letters. There are no phone numbers or emails on profiles, and you can hide your photo whenever you like.")}
  </article>`;
  $("#back").onclick = () => { if (!me.created){ location.hash = ""; route(); return; } history.length > 1 ? history.back() : (location.hash = "#descubrir"); };
  startFlow($(".art .flowcard")); startPrep($("#prepcard"));
}

const views = {descubrir, cartas, perfil, como};
function route(){
  const onb = !me.created; document.querySelector(".tabs").hidden = onb; $("#bellBtn").hidden = onb;
  if (onb && location.hash === "#como"){ document.body.classList.remove("wide"); como(); window.scrollTo(0,0); return; }
  if (onb){ alta(); window.scrollTo(0,0); return; }
  document.body.classList.remove("wide");
  const v = (location.hash || "#descubrir").slice(1), name = views[v] ? v : "descubrir";
  if (name !== "cartas") openId = null;
  document.querySelectorAll(".tabs a").forEach(a => a.dataset.v===name ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  views[name](); window.scrollTo(0,0);
}
document.querySelector('.tabs a[data-v="cartas"]').addEventListener("click", () => { openId = null; if (location.hash==="#cartas") route(); });
window.addEventListener("hashchange", route);

/* ---- Textos fijos de la cabecera y las pestañas ---- */
function applyStatic(){
  document.documentElement.lang = lang;
  $(".slogan").textContent = L("Mensajería a fuego lento","Slow-cooked mail");
  $(".demo").textContent = L("Prototipo","Prototype");
  $("#helpBtn").innerHTML = `<span class="hl">${L("Cómo funciona","How it works")}</span><span class="hq" aria-hidden="true">?</span>`;
  $("#helpBtn").setAttribute("aria-label", L("Cómo funciona","How it works"));
  $("#bellBtn").setAttribute("aria-label", L("Avisos","Notifications"));
  const tabTxt = {descubrir:L("Descubrir","Discover"), cartas:L("Cartas","Letters"), perfil:L("Perfil","Profile")};
  document.querySelectorAll(".tabs a").forEach(a => { const t = a.querySelector(".tl"); if (t) t.textContent = tabTxt[a.dataset.v]; });
  const lb = $("#langBtn"); lb.textContent = lang==="en" ? "ES" : "EN"; lb.setAttribute("aria-label", lang==="en" ? "Cambiar a español" : "Switch to English");
}
function setLang(l){ lang = l; try { localStorage.setItem("remitee-lang", l); } catch(e){} document.querySelectorAll(".overlay").forEach(o => o.remove()); applyStatic(); setTheme(document.documentElement.getAttribute("data-theme")||"light"); route(); }

// Tema: claro por defecto, botón para pasar a oscuro.
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  const b = $("#themeBtn"); b.innerHTML = t==="dark" ? SUN : MOON;
  b.setAttribute("aria-label", t==="dark" ? L("Cambiar a modo claro","Switch to light mode") : L("Cambiar a modo oscuro","Switch to dark mode"));
  try { localStorage.setItem("remitee-theme", t); } catch(e) {}
}
let saved = null; try { saved = localStorage.getItem("remitee-theme"); } catch(e) {}
setTheme(saved === "dark" ? "dark" : "light");
applyStatic();
$("#helpBtn").onclick = showFlow;
$("#bellBtn").onclick = showNotifs;
$("#langBtn").onclick = () => setLang(lang === "en" ? "es" : "en");
$("#themeBtn").onclick = () => setTheme(document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark");
route();
</script>
