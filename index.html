<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
html{color-scheme:light}body{margin:0}[hidden]{display:none!important}
/* Layout: una sola columna estrecha tipo app móvil, barra de pestañas fija abajo, mucho aire y un único acento suave. */
:root{
  --bg:#f7f8fc; --surface:#ffffff; --ink:#22263a; --muted:#8a90a6; --line:#eceef5;
  --accent:#5b6cf0; --accent-soft:#eceefe; --ok:#2fa36b; --ok-soft:#e5f6ee; --warm:#f2a64a; --warm-soft:#fdf2e4;
  --head:"Outfit", "Segoe UI", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141c; --surface:#1b1e29; --ink:#eceef6; --muted:#878ca3; --line:#272b3a;
  --accent:#8d99ff; --accent-soft:#252a4a; --ok:#5cc792; --ok-soft:#1d3329; --warm:#f2b46a; --warm-soft:#3a2e1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141c; --surface:#1b1e29; --ink:#eceef6; --muted:#878ca3; --line:#272b3a;
  --accent:#8d99ff; --accent-soft:#252a4a; --ok:#5cc792; --ok-soft:#1d3329; --warm:#f2b46a; --warm-soft:#3a2e1f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
.app{max-width:440px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding-block:22px 18px}
.logo{font-family:var(--head);font-weight:700;font-size:1.45rem;letter-spacing:-.02em;margin:0}
.logo span{color:var(--accent)}
.demo{font-size:.7rem;font-weight:500;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
h2{font-family:var(--head);font-weight:600;font-size:1.35rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px}
button{font-family:var(--body);font-weight:600;font-size:.95rem;border:0;border-radius:999px;padding:13px 20px;cursor:pointer;background:var(--accent);color:#fff;transition:transform .12s, opacity .12s}
button:active{transform:scale(.97)}
button.soft{background:var(--accent-soft);color:var(--accent)}
button.plain{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.avatar{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-weight:600;font-size:1.1rem;color:var(--ink)}
.chip{font-size:.78rem;background:var(--bg);border:1px solid var(--line);padding:4px 11px;border-radius:999px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* Descubrir */
.card{background:var(--surface);border-radius:28px;padding:28px 24px 24px;box-shadow:0 10px 30px -18px rgba(40,50,110,.35);display:grid;gap:18px;text-align:center}
.card .avatar{width:84px;height:84px;font-size:1.7rem;margin:0 auto}
.card .name{font-family:var(--head);font-weight:600;font-size:1.4rem;margin:0}
.card .where{color:var(--muted);font-size:.85rem;margin-top:2px}
.card .bio{font-size:1rem;margin:0;color:var(--ink)}
.card .chips{justify-content:center}
.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.hint{color:var(--muted);font-size:.82rem;text-align:center;margin-top:14px}

/* Overlay match */
.overlay{position:fixed;inset:0;background:rgba(18,20,30,.45);display:grid;place-items:center;padding:20px;z-index:20}
.modal{background:var(--surface);border-radius:28px;padding:30px 24px;max-width:380px;width:100%;text-align:center;display:grid;gap:16px}
.pair{display:flex;justify-content:center}
.pair .avatar{width:68px;height:68px;font-size:1.4rem;border:4px solid var(--surface)}
.pair .avatar+.avatar{margin-left:-14px}
.modal h3{font-family:var(--head);font-weight:700;font-size:1.5rem;margin:0}

/* Lista de cartas */
.list{display:grid;gap:10px}
.item{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:var(--r);padding:14px 16px;cursor:pointer;border:0;width:100%;text-align:left;color:var(--ink);font-weight:400}
.item .txt{flex:1;min-width:0}
.item .n{font-family:var(--head);font-weight:600;font-size:1.02rem}
.item .s{color:var(--muted);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.empty{background:var(--surface);border-radius:var(--r);padding:34px 22px;text-align:center;color:var(--muted)}

/* Ventana de correspondencia */
.back{background:none;color:var(--accent);padding:4px 0;margin-bottom:10px;font-weight:600}
.chead{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.chead .n{font-family:var(--head);font-weight:600;font-size:1.25rem}
.chead .s{color:var(--muted);font-size:.84rem}
.sendto{background:var(--surface);border-radius:var(--r);padding:18px;display:grid;gap:6px;margin-bottom:18px}
.sendto .lbl{font-size:.74rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sendto .addr{font-size:.93rem}
.sendto .code{font-family:ui-monospace,Menlo,monospace;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;display:inline-block;margin-top:2px}
.timeline{display:grid;gap:10px;margin-bottom:18px}
.letter{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:12px 14px;max-width:88%}
.letter.mine{margin-left:auto;background:var(--accent-soft)}
.letter .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--bg)}
.letter.mine .ic{background:var(--surface)}
.letter .t{font-weight:600;font-size:.9rem}
.letter .d{color:var(--muted);font-size:.8rem}
.status{font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;margin-left:auto;white-space:nowrap}
.status.way{background:var(--warm-soft);color:var(--warm)}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.bigbtn{width:100%;padding:16px;font-size:1rem}
.note{color:var(--muted);font-size:.82rem;text-align:center;margin-top:10px}

/* Perfil */
.form{display:grid;gap:14px}
.field{display:grid;gap:6px;background:var(--surface);border-radius:var(--r);padding:14px 16px}
.field label{font-size:.76rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input,textarea{font:inherit;color:var(--ink);background:transparent;border:0;padding:2px 0;width:100%;resize:vertical}
.field small{color:var(--muted);font-size:.8rem}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:10}
.tabs .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs a{display:grid;justify-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.74rem;font-weight:500;padding:6px;border-radius:12px;position:relative}
.tabs a[aria-current="page"]{color:var(--accent)}
.tabs svg{width:23px;height:23px}
.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--accent);color:#fff;font-size:.62rem;font-weight:600;min-width:17px;height:17px;border-radius:999px;display:grid;place-items:center;padding:0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.88rem;font-weight:500;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <div class="top"><h1 class="logo">remite<span>.</span></h1><span class="demo">Prototipo</span></div>
  <main id="view"></main>
</div>

<nav class="tabs"><div class="in">
  <a href="#descubrir" data-v="descubrir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Descubrir</a>
  <a href="#cartas" data-v="cartas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>Cartas<span class="badge" id="badge" hidden></span></a>
  <a href="#perfil" data-v="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.3-3.6 4.2-5.3 7.5-5.3s6.2 1.7 7.5 5.3"/></svg>Perfil</a>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script>
const CENTRAL = "Remite · Apartado 123 · 39080 Santander";
const me = {alias:"Tinta Azul", code:"MAR-1907", bio:"Escribo mejor de lo que hablo. Busco a alguien con quien contarse el mes, sin prisa.", intereses:"cine, fotografía analógica, viajes"};
const tints = ["#ffe3d6","#dfe9ff","#dff5e8","#f3e1fb","#fff1c9"];
const people = [
  {id:1, alias:"Lince", zona:"Asturias", edad:32, code:"LUNA-4821", likesMe:true,  bio:"Colecciono sellos de países que no he pisado. Me gustan las cartas largas y las posdatas más largas todavía.", tags:["sellos","novela","montaña"]},
  {id:2, alias:"Marea", zona:"Cádiz", edad:28, code:"SAL-0316", likesMe:false, bio:"Profesora de música. Te cuento qué suena en mi barrio si tú me cuentas qué se ve desde tu ventana.", tags:["música","mar","cocina"]},
  {id:3, alias:"Ciprés", zona:"Girona", edad:41, code:"OLMO-7720", likesMe:true,  bio:"Escribo a mano desde niño y echo de menos abrir el buzón con ganas. Prometo buena letra.", tags:["caligrafía","jazz","plantas"]},
  {id:4, alias:"Noria", zona:"Madrid", edad:34, code:"VELA-2054", likesMe:true,  bio:"Trabajo con pantallas todo el día. Quiero algo que tarde en llegar y se pueda guardar en una caja.", tags:["cine","poesía","bici"]},
  {id:5, alias:"Grulla", zona:"Lugo", edad:58, code:"NUBE-6631", likesMe:false, bio:"Jubilada y curiosa. Me encantan las recetas heredadas y las historias de pueblo.", tags:["recetas","historia","punto"]}
];
let idx = 0, openId = null;
const chats = []; // {p, letters:[{mine, at, delivered}], unread}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tint = p => tints[(p.id-1) % tints.length];
const av = (p, cls="") => `<div class="avatar ${cls}" style="background:${tint(p)};color:#2a2e45">${esc(p.alias[0])}</div>`;
const meAv = `<div class="avatar" style="background:var(--accent);color:#fff">${esc(me.alias[0])}</div>`;
const fmt = d => d.toLocaleDateString("es-ES",{day:"numeric",month:"short"});
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2600)}
function badge(){const n=chats.filter(c=>c.unread).length;const b=$("#badge");b.textContent=n;b.hidden=!n}
const pending = () => people.filter(p => !p.seen);

function descubrir(){
  const left = pending();
  if (!left.length){ $("#view").innerHTML = `<h2>Descubrir</h2><p class="sub">Personas que también quieren escribir.</p><div class="empty">Has visto todos los perfiles por hoy.<br>Vuelve mañana: llegan personas nuevas.</div>`; return; }
  const p = left[0];
  $("#view").innerHTML = `<h2>Descubrir</h2><p class="sub">Elige por cómo escribe, no por su foto.</p>
    <article class="card">
      ${av(p)}
      <div><p class="name">${esc(p.alias)}, ${p.edad}</p><div class="where">${esc(p.zona)}</div></div>
      <p class="bio">${esc(p.bio)}</p>
      <div class="chips">${p.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>
      <div class="actions"><button class="plain" id="no">Pasar</button><button id="yes">Quiero escribirle</button></div>
    </article>
    <p class="hint">Si los dos os elegís, se abre la correspondencia.</p>`;
  $("#no").onclick = () => { p.seen = true; descubrir(); };
  $("#yes").onclick = () => {
    p.seen = true;
    if (p.likesMe){ chats.unshift({p, letters:[], unread:true}); badge(); match(p); }
    else { toast(`Si ${p.alias} también te elige, os avisaremos`); }
    descubrir();
  };
}

function match(p){
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="modal" role="dialog" aria-label="Match">
    <div class="pair">${meAv}${av(p)}</div>
    <h3>¡Es mutuo!</h3>
    <p style="margin:0;color:var(--muted)">Tú y ${esc(p.alias)} queréis escribiros. Ya podéis empezar la correspondencia.</p>
    <button id="go">Abrir correspondencia</button><button class="plain" id="later">Más tarde</button></div>`;
  document.body.appendChild(o);
  o.querySelector("#go").onclick = () => { o.remove(); openId = p.id; location.hash = "#cartas"; route(); };
  o.querySelector("#later").onclick = () => o.remove();
}

function lastLine(c){
  if (!c.letters.length) return "Nueva correspondencia · escribe la primera carta";
  const l = c.letters[c.letters.length-1];
  if (l.mine) return l.delivered ? `Tu carta ha llegado · ${fmt(l.at)}` : `Tu carta va en camino · ${fmt(l.at)}`;
  return `${c.p.alias} te ha escrito · ${fmt(l.at)}`;
}

function cartas(){
  if (openId){ return ventana(chats.find(c => c.p.id === openId)); }
  $("#view").innerHTML = `<h2>Cartas</h2><p class="sub">Tus correspondencias abiertas.</p>` + (chats.length
    ? `<div class="list">${chats.map(c=>`<button class="item" data-id="${c.p.id}">${av(c.p)}<div class="txt"><div class="n">${esc(c.p.alias)}</div><div class="s">${esc(lastLine(c))}</div></div>${c.unread?'<span class="dot" aria-label="Novedad"></span>':""}</button>`).join("")}</div>`
    : `<div class="empty">Aún no tienes correspondencias.<br>Cuando haya un match mutuo, aparecerá aquí.</div>`);
  document.querySelectorAll(".item").forEach(b => b.onclick = () => { openId = +b.dataset.id; cartas(); });
}

function ventana(c){
  c.unread = false; badge();
  const last = c.letters[c.letters.length-1];
  const waiting = last && last.mine;
  $("#view").innerHTML = `<button class="back" id="back">← Cartas</button>
    <div class="chead">${av(c.p)}<div><div class="n">${esc(c.p.alias)}</div><div class="s">${esc(c.p.zona)} · ${c.letters.length} ${c.letters.length===1?"carta":"cartas"}</div></div></div>
    <div class="sendto"><span class="lbl">Escribe en el sobre</span><span class="addr">${esc(CENTRAL)}</span><span>Para: <span class="code">${esc(c.p.code)}</span></span></div>
    <div class="timeline">${c.letters.length ? c.letters.map(l=>`
      <div class="letter ${l.mine?"mine":""}"><div class="ic">✉︎</div><div><div class="t">${l.mine?"Tu carta":`Carta de ${esc(c.p.alias)}`}</div><div class="d">Enviada el ${fmt(l.at)}</div></div>
      ${l.mine?`<span class="status ${l.delivered?"ok":"way"}">${l.delivered?"Entregada":"En camino"}</span>`:`<span class="status ok">Recibida</span>`}</div>`).join("")
      : `<div class="empty" style="padding:24px">Todavía no hay cartas.<br>Escribe la primera a mano y envíala a la dirección de arriba.</div>`}</div>
    <button class="bigbtn" id="sent" ${waiting?"disabled":""}>${waiting?"Carta enviada ✓":"Ya he enviado la carta"}</button>
    <p class="note">${waiting?`Te avisaremos cuando llegue y cuando ${esc(c.p.alias)} te responda.`:"Pulsa cuando hayas echado la carta al buzón."}</p>`;
  $("#back").onclick = () => { openId = null; cartas(); };
  $("#sent").onclick = () => {
    const l = {mine:true, at:new Date(), delivered:false}; c.letters.push(l);
    toast(`Carta enviada a ${c.p.alias}`); ventana(c);
    // Simulación: entrega y respuesta
    setTimeout(()=>{ l.delivered = true; if (openId===c.p.id && location.hash==="#cartas") ventana(c); }, 2500);
    setTimeout(()=>{ c.letters.push({mine:false, at:new Date()}); c.unread = openId!==c.p.id; badge();
      if (openId===c.p.id && location.hash==="#cartas") ventana(c); toast(`${c.p.alias} te ha enviado una carta`); }, 6000);
  };
}

function perfil(){
  $("#view").innerHTML = `<h2>Perfil</h2><p class="sub">Esto es lo que ven los demás. Sin teléfono ni email.</p>
  <form class="form" id="pf">
    <div style="display:flex;gap:14px;align-items:center;margin-bottom:4px">${meAv}<div><div style="font-family:var(--head);font-weight:600;font-size:1.15rem">${esc(me.alias)}</div><div style="color:var(--muted);font-size:.84rem">Tu código: <b>${esc(me.code)}</b></div></div></div>
    <div class="field"><label for="f-a">Alias</label><input id="f-a" value="${esc(me.alias)}"></div>
    <div class="field"><label for="f-b">Sobre ti</label><textarea id="f-b" rows="3">${esc(me.bio)}</textarea></div>
    <div class="field"><label for="f-i">Intereses</label><input id="f-i" value="${esc(me.intereses)}"></div>
    <div class="field"><label for="f-d">Dirección postal</label><input id="f-d" value="C/ Ejemplo 1 · Torrelavega"><small>Privada. Nadie la ve: solo se usa para reenviarte las cartas.</small></div>
    <button type="submit">Guardar</button>
  </form>`;
  $("#pf").onsubmit = e => { e.preventDefault(); me.alias = $("#f-a").value.trim() || me.alias; me.bio = $("#f-b").value; me.intereses = $("#f-i").value; toast("Perfil guardado"); perfil(); };
}

const views = {descubrir, cartas, perfil};
function route(){
  const v = (location.hash || "#descubrir").slice(1), name = views[v] ? v : "descubrir";
  if (name !== "cartas") openId = null;
  document.querySelectorAll(".tabs a").forEach(a => a.dataset.v===name ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  views[name](); window.scrollTo(0,0);
}
document.querySelector('.tabs a[data-v="cartas"]').addEventListener("click", () => { openId = null; if (location.hash==="#cartas") route(); });
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
