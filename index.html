<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remitee</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
html{color-scheme:light}body{margin:0}[hidden]{display:none!important}
/* Layout: una sola columna estrecha tipo app móvil, barra de pestañas fija abajo, mucho aire y un único acento suave. */
:root{
  --bg:#f7f8fc; --surface:#ffffff; --ink:#22263a; --muted:#8a90a6; --line:#eceef5;
  --accent:#5b6cf0; --accent-soft:#eceefe; --ok:#2fa36b; --ok-soft:#e5f6ee; --warm:#d98a1e; --warm-soft:#fdf2e4; --bad:#d64c4c; --bad-soft:#fdeaea;
  --head:"Outfit", "Segoe UI", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141c; --surface:#1b1e29; --ink:#eceef6; --muted:#878ca3; --line:#272b3a;
  --accent:#8d99ff; --accent-soft:#252a4a; --ok:#5cc792; --ok-soft:#1d3329; --warm:#f2b46a; --warm-soft:#3a2e1f; --bad:#f08080; --bad-soft:#3b2224; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141c; --surface:#1b1e29; --ink:#eceef6; --muted:#878ca3; --line:#272b3a;
  --accent:#8d99ff; --accent-soft:#252a4a; --ok:#5cc792; --ok-soft:#1d3329; --warm:#f2b46a; --warm-soft:#3a2e1f; --bad:#f08080; --bad-soft:#3b2224; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
.app{max-width:440px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding-block:22px 18px}
.logo{font-family:var(--head);font-weight:700;font-size:1.45rem;letter-spacing:-.02em;margin:0}
.logo span{color:var(--accent)}
.theme-btn{width:38px;height:38px;padding:0;border-radius:50%;background:var(--surface);color:var(--ink);border:1px solid var(--line);display:grid;place-items:center}
.theme-btn svg{width:18px;height:18px}
.topr{display:flex;gap:10px;align-items:center}
.demo{font-size:.7rem;font-weight:500;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
h2{font-family:var(--head);font-weight:600;font-size:1.35rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px}
button{font-family:var(--body);font-weight:600;font-size:.95rem;border:0;border-radius:999px;padding:13px 20px;cursor:pointer;background:var(--accent);color:#fff;transition:transform .12s, opacity .12s}
button:active{transform:scale(.97)}
button.soft{background:var(--accent-soft);color:var(--accent)}
button.plain{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.avatar{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-weight:600;font-size:1.1rem;color:var(--ink)}
.chip{font-size:.78rem;background:var(--bg);border:1px solid var(--line);padding:4px 11px;border-radius:999px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* Descubrir */
.card{background:var(--surface);border-radius:28px;padding:28px 24px 24px;box-shadow:0 10px 30px -18px rgba(40,50,110,.35);display:grid;gap:18px;text-align:center}
.card .avatar{width:84px;height:84px;font-size:1.7rem;margin:0 auto}
.card .name{font-family:var(--head);font-weight:600;font-size:1.4rem;margin:0}
.card .where{color:var(--muted);font-size:.85rem;margin-top:2px}
.card .bio{font-size:1rem;margin:0;color:var(--ink)}
.card .chips{justify-content:center}
.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.hint{color:var(--muted);font-size:.82rem;text-align:center;margin-top:14px}

/* Overlay match */
.overlay{position:fixed;inset:0;background:rgba(18,20,30,.45);display:grid;place-items:center;padding:20px;z-index:20}
.modal{background:var(--surface);border-radius:28px;padding:30px 24px;max-width:380px;width:100%;text-align:center;display:grid;gap:16px}
.pair{display:flex;justify-content:center}
.pair .avatar{width:68px;height:68px;font-size:1.4rem;border:4px solid var(--surface)}
.pair .avatar+.avatar{margin-left:-14px}
.modal h3{font-family:var(--head);font-weight:700;font-size:1.5rem;margin:0}

/* Lista de cartas */
.list{display:grid;gap:10px}
.item{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:var(--r);padding:14px 16px;cursor:pointer;border:0;width:100%;text-align:left;color:var(--ink);font-weight:400}
.item .txt{flex:1;min-width:0}
.item .n{font-family:var(--head);font-weight:600;font-size:1.02rem}
.item .s{color:var(--muted);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.empty{background:var(--surface);border-radius:var(--r);padding:34px 22px;text-align:center;color:var(--muted)}

/* Ventana de correspondencia */
.back{background:none;color:var(--accent);padding:4px 0;margin-bottom:10px;font-weight:600}
.chead{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.chead .n{font-family:var(--head);font-weight:600;font-size:1.25rem}
.chead .s{color:var(--muted);font-size:.84rem}
.sendto{background:var(--surface);border-radius:var(--r);padding:18px;display:grid;gap:6px;margin-bottom:18px}
.sendto .lbl{font-size:.74rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sendto .addr{font-size:.93rem}
.sendto .code{font-family:ui-monospace,Menlo,monospace;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;display:inline-block;margin-top:2px}
.timeline{display:grid;gap:10px;margin-bottom:18px}
.letter{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:12px 14px;max-width:88%}
.letter.mine{margin-left:auto;background:var(--accent-soft)}
.letter .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--bg)}
.letter.mine .ic{background:var(--surface)}
.letter .t{font-weight:600;font-size:.9rem}
.letter .d{color:var(--muted);font-size:.8rem}
.status{font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;margin-left:auto;white-space:nowrap}
.status.way{background:var(--warm-soft);color:var(--warm)}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.bigbtn{width:100%;padding:16px;font-size:1rem}
.note{color:var(--muted);font-size:.82rem;text-align:center;margin-top:10px}

/* Perfil */
.form{display:grid;gap:14px}
.field{display:grid;gap:6px;background:var(--surface);border-radius:var(--r);padding:14px 16px}
.field label{font-size:.76rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input,textarea{font:inherit;color:var(--ink);background:transparent;border:0;padding:2px 0;width:100%;resize:vertical}
.field small{color:var(--muted);font-size:.8rem}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:10}
.tabs .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs a{display:grid;justify-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.74rem;font-weight:500;padding:6px;border-radius:12px;position:relative}
.tabs a[aria-current="page"]{color:var(--accent)}
.tabs svg{width:23px;height:23px}
.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--accent);color:#fff;font-size:.62rem;font-weight:600;min-width:17px;height:17px;border-radius:999px;display:grid;place-items:center;padding:0 4px}
/* Fotos */
.ph{flex:none;border-radius:50%;position:relative;overflow:hidden;display:grid;place-items:center;background-size:cover;background-position:center}
.ph.big{width:110px;height:110px;margin:0 auto}
.ph.md{width:68px;height:68px;border:4px solid var(--surface)}
.ph.sm{width:52px;height:52px}
.ph.locked::before{content:"";position:absolute;inset:-12px;background:inherit;filter:blur(14px)}
.ph .lock{position:relative;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;color:#2a2e45}
.ph .lock svg{width:17px;height:17px}
.ph .init{font-family:var(--head);font-weight:600;color:#2a2e45;font-size:1.2rem;position:relative}
.ph.big .init{font-size:2rem}
.phnote{font-size:.78rem;color:var(--muted);margin-top:8px}
.common{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.photo-pick{display:flex;gap:14px;align-items:center}
.photo-pick input[type=file]{font-size:.85rem}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:14px 16px}
.switch b{font-weight:600;font-size:.95rem}
.switch small{display:block;color:var(--muted);font-size:.8rem}
.switch input{width:46px;height:26px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:23px}
.sim{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;padding:12px 14px;border:1px dashed var(--line);border-radius:16px;font-size:.84rem;color:var(--muted)}
.sim b{color:var(--ink);font-weight:600}
button.sm{padding:7px 13px;font-size:.82rem}
.dl{border-radius:var(--r);padding:14px 16px;margin-bottom:14px;font-size:.88rem;display:grid;gap:3px}
.dl b{font-family:var(--head);font-weight:600;font-size:1rem}
.dl.mine{background:var(--accent-soft);color:var(--ink)} .dl.mine b{color:var(--accent)}
.dl.warn{background:var(--warm-soft);color:var(--ink)} .dl.warn b{color:var(--warm)}
.dl.them{background:var(--surface);color:var(--muted)} .dl.them b{color:var(--ink)}
.dl.bad{background:var(--bad-soft);color:var(--ink)} .dl.bad b{color:var(--bad)}
.susp{background:var(--bad-soft);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;font-size:.88rem}
.susp b{color:var(--bad)}
.item.closed{opacity:.6}
.item .s.urgent{color:var(--warm);font-weight:600}
.paywall{margin-top:16px;background:var(--surface);border-radius:var(--r);padding:20px;text-align:center;display:grid;gap:10px;border:1px solid var(--accent-soft)}
.paywall b{font-family:var(--head);font-weight:600;font-size:1.1rem}
.paywall p{margin:0;color:var(--muted);font-size:.9rem}
.paywall small{color:var(--muted);font-size:.75rem}
.about{background:var(--surface);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.about summary{cursor:pointer;font-family:var(--head);font-weight:600;font-size:1rem;list-style-position:inside}
.about p{margin:0 0 8px;font-size:.93rem}
.about small{color:var(--muted);font-size:.8rem}
.welcome{display:grid;gap:14px;text-align:center;padding-top:20px}
.welcome h2{font-size:1.7rem;line-height:1.2}
.perks{list-style:none;padding:0;margin:0 0 6px;display:grid;gap:8px;text-align:left;background:var(--surface);border-radius:var(--r);padding:16px 18px}
.perks li{padding-left:24px;position:relative;font-size:.92rem}
.perks li::before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:700}
button.google{background:var(--surface);color:var(--ink);border:1px solid var(--line);width:100%;padding:15px}
.gsim{background:var(--surface);border-radius:var(--r);padding:16px}
.gsim .field{padding:0;background:transparent}
.gsim input{border-bottom:1px solid var(--line);padding:8px 0}
.verified{display:flex;gap:12px;align-items:center;background:var(--ok-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.verified b{display:block;font-size:.92rem;color:var(--ok)}
.verified small{color:var(--muted);font-size:.8rem}
.vdot{width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.wmodal{text-align:left;gap:12px;max-height:calc(100% - 20px);overflow:auto}
.wtop{display:grid;gap:8px}
.wstep{font-size:.75rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.wbar{height:5px;background:var(--line);border-radius:999px;overflow:hidden}
.wbar span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.wdesc{margin:0;color:var(--muted);font-size:.92rem}
.wfields{display:grid;gap:10px}
.wfields .field{background:var(--bg)}
.wbtns{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.wphoto{display:grid;justify-items:center;gap:12px;padding:6px 0}
.filebtn{font-weight:600;font-size:.9rem;color:var(--accent);background:var(--accent-soft);padding:9px 16px;border-radius:999px;cursor:pointer}
.wfields .switch{background:var(--bg)}
.sel{font:inherit;color:var(--ink);background:transparent;border:0;padding:2px 0}
.lockline{font-size:.85rem;color:var(--ink);background:var(--ok-soft);border-radius:14px;padding:10px 12px}
.wbg{opacity:.5}
.flow{display:grid;gap:8px}
.flow svg{width:100%;height:auto;display:block}
.fl-line{stroke:var(--line);stroke-width:2;stroke-dasharray:4 5;fill:none}
.fl-arc{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 5;fill:none;opacity:0;transition:opacity .4s}
.fl-arc.show{opacity:.7}
.fl-me{fill:var(--accent)} .fl-them{fill:#ffe3d6}
.fl-init{font-family:var(--head);font-weight:600;font-size:13px;text-anchor:middle;fill:#2a2e45}
.fl-node:first-of-type .fl-init{fill:#fff}
.fl-off{fill:var(--accent-soft)} .fl-house{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
#fl-office{transition:opacity .4s} #fl-office.dim{opacity:.3}
.fl-lbl{font-size:11px;text-anchor:middle;fill:var(--muted);font-family:var(--body)}
.fl-envr{fill:var(--surface);stroke:var(--ink);stroke-width:1.6} .fl-envf{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.fl-txt{margin:0;min-height:3.1em;font-size:.92rem;text-align:center;color:var(--ink)}
.fl-dots{display:flex;justify-content:center;gap:6px}
.fl-dots span{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .3s,width .3s}
.fl-dots span.on{background:var(--accent);width:18px;border-radius:999px}
.flowcard{background:var(--surface);border-radius:var(--r);padding:14px 14px 12px}
.linkbtn{background:none;color:var(--accent);padding:4px 0 0;font-size:.85rem;justify-self:start}
.share{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.share b{font-weight:600;font-size:.95rem}
.share small{display:block;color:var(--muted);font-size:.8rem}
.agecheck{display:flex;gap:10px;align-items:center;font-size:.9rem;padding:4px 2px}
.agecheck input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.helpbtn{background:var(--accent-soft);color:var(--accent);padding:8px 13px;font-size:.8rem}
.art{display:grid;gap:4px;padding-bottom:10px}
.art-kicker{font-size:.74rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.art h2{font-size:1.6rem;margin-bottom:6px}
.art-lede{font-size:1.02rem;margin:0 0 14px;color:var(--ink)}
.art .flowcard{margin-bottom:10px}
.art h3{font-family:var(--head);font-weight:600;font-size:1.08rem;margin:18px 0 2px}
.art p{margin:0;color:var(--ink);max-width:62ch}
.code-inline{font-family:ui-monospace,Menlo,monospace;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:5px;font-size:.9em}
.views{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;color:var(--muted);margin-bottom:10px}
.vbar{display:flex;gap:4px}
.vbar i{width:18px;height:4px;border-radius:999px;background:var(--line)}
.vbar i.used{background:var(--muted)}
.vbar i.now{background:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.88rem;font-weight:500;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <div class="top"><h1 class="logo">remitee<span>.</span></h1><div class="topr"><span class="demo">Prototipo</span><button class="helpbtn" id="helpBtn" hidden>Cómo funciona</button><button class="theme-btn" id="themeBtn" aria-label="Cambiar a modo oscuro"></button></div></div>
  <main id="view"></main>
</div>

<nav class="tabs"><div class="in">
  <a href="#descubrir" data-v="descubrir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Descubrir</a>
  <a href="#cartas" data-v="cartas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>Cartas<span class="badge" id="badge" hidden></span></a>
  <a href="#perfil" data-v="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.3-3.6 4.2-5.3 7.5-5.3s6.2 1.7 7.5 5.3"/></svg>Perfil</a>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script>
const CENTRAL = "Remitee · Apartado 123 · 39080 Santander";
const me = {created:false, email:"", verified:false, alias:"", edad:"30–35", zona:"", prof:"", code:"", bio:"", long:"", intereses:"", dir:"", foto:null, showFoto:true};
loadMe();
const tints = ["#ffe3d6","#dfe9ff","#dff5e8","#f3e1fb","#fff1c9"];
// "Fotos" de ejemplo: degradados en lugar de retratos reales. showFoto = la persona decide si la enseña tras el match.
const shots = [
  "radial-gradient(circle at 35% 30%,#ffd2b8 0 22%,transparent 23%),radial-gradient(ellipse at 50% 95%,#e8956f 0 38%,transparent 39%),linear-gradient(160deg,#ffe9dc,#f6b99a)",
  "radial-gradient(circle at 50% 34%,#c9d8ff 0 21%,transparent 22%),radial-gradient(ellipse at 50% 100%,#6f8fe0 0 40%,transparent 41%),linear-gradient(160deg,#eef3ff,#a9bdf3)",
  "radial-gradient(circle at 55% 33%,#cdeedd 0 21%,transparent 22%),radial-gradient(ellipse at 52% 100%,#5fae86 0 40%,transparent 41%),linear-gradient(160deg,#eefaf3,#9fd9bb)",
  "radial-gradient(circle at 45% 32%,#ecd2f7 0 21%,transparent 22%),radial-gradient(ellipse at 48% 100%,#a874c9 0 40%,transparent 41%),linear-gradient(160deg,#faf0ff,#d3aee8)",
  "radial-gradient(circle at 50% 33%,#fff0bf 0 21%,transparent 22%),radial-gradient(ellipse at 50% 100%,#d9a83a 0 40%,transparent 41%),linear-gradient(160deg,#fffbea,#f2d68a)"
];
const people = [

// Más perfiles de ejemplo para poder probar el límite diario
[["Brújula","Navarra","35–40","Ingeniero agrónomo",["viajes","huerto","cine"]],["Tilde","Salamanca","25–30","Correctora de textos",["poesía","teatro","café"]],
 ["Faro","A Coruña","45–50","Marinero",["mar","radio","fotografía"]],["Sauce","Valencia","30–35","Fisioterapeuta",["yoga","novela","cocina"]],

 ["Cometa","Zaragoza","25–30","Investigadora de historia",["historia","cine","cómic"]],["Raíz","Cáceres","60+","Maestro jubilado",["huerto","recetas","poesía"]],
 ["Lunar","Murcia","30–35","Veterinaria",["animales","fotografía","bici"]],["Delta","Tarragona","35–40","Cocinero",["cocina","vino","música"]]

const myTags = () => me.intereses.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);
const common = p => p.tags.filter(t => myTags().includes(t.toLowerCase()));
const LOCK = `<span class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>`;
// Foto de una persona. matched=false → bloqueada (borrosa con candado).
function photo(p, size, matched){
  if (!p.showFoto) return `<div class="ph ${size}" style="background:${tint(p)}"><span class="init">${esc(p.alias[0])}</span></div>`;
  return `<div class="ph ${size} ${matched?"":"locked"}" style="background:${shots[(p.id-1)%shots.length]}" role="img" aria-label="${matched?`Foto de ${esc(p.alias)} (ejemplo)`:"Foto oculta hasta el match"}">${matched?"":LOCK}</div>`;
}
function myPhoto(size){
  if (me.foto && me.showFoto) return `<div class="ph ${size}" style="background-image:url('${me.foto}')" role="img" aria-label="Tu foto"></div>`;
  return `<div class="ph ${size}" style="background:var(--accent)"><span class="init" style="color:#fff">${esc((me.alias||"?")[0])}</span></div>`;
}
let idx = 0, openId = null;
const chats = []; // {p, letters:[{mine, at, delivered}], unread}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tint = p => tints[(p.id-1) % tints.length];
const av = (p, cls="") => `<div class="avatar ${cls}" style="background:${tint(p)};color:#2a2e45">${esc(p.alias[0])}</div>`;
const meAv = `<div class="avatar" style="background:var(--accent);color:#fff">${esc((me.alias||"?")[0])}</div>`;
const fmt = d => d.toLocaleDateString("es-ES",{day:"numeric",month:"short"});
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,3200)}
function badge(){const n=chats.filter(c=>c.unread).length;const b=$("#badge");b.textContent=n;b.hidden=!n}
const pending = () => people.filter(p => !p.seen);

/* ---- Reglas y reloj simulado ---- */
const FIRST_DAYS = 7, REPLY_DAYS = 14, POST_DAYS = 3, SUSPEND_DAYS = 3;
const DAY = 864e5; let now = new Date(); now.setHours(10,0,0,0);
const addD = (d,n) => new Date(+d + n*DAY);
const daysLeft = d => Math.max(0, Math.ceil((d - now)/DAY));
// Cuántos días tarda cada perfil de ejemplo en responder tras recibir tu carta. null = nunca responde.
const replyAfter = {1:4, 3:null, 4:6};
const VIEW_LIMIT = 5; let viewsUsed = 0, viewDay = now.toDateString(), plus = false;
function viewsLeft(){ if (viewDay !== now.toDateString()){ viewDay = now.toDateString(); viewsUsed = 0; } return plus ? Infinity : VIEW_LIMIT - viewsUsed; }
const suspended = () => me.suspendedUntil && now < me.suspendedUntil;

function tick(){
  chats.forEach(c => {
    if (c.closed) return;
    if (c.turn==="them" && c.replyAt && now >= c.replyAt){
      const at = c.replyAt, arrive = addD(at, POST_DAYS);
      c.letters.push({mine:false, at, arrive}); c.turn="me"; c.deadline = addD(arrive, REPLY_DAYS); c.replyAt=null;
      c.unread = true; toast(`${c.p.alias} te ha enviado una carta`);
    }
    if (now > c.deadline){
      if (c.turn==="me"){ c.closed="me"; me.suspendedUntil = addD(now, SUSPEND_DAYS);
        toast(`No respondiste a tiempo a ${c.p.alias}. Cuenta suspendida ${SUSPEND_DAYS} días`); }
      else { c.closed="them"; c.unread = true;
        toast(`${c.p.alias} no respondió a tiempo. Su cuenta queda suspendida y la correspondencia se cierra`); }
    }
  });
  badge();
}
function sim(){
  return `<div class="sim"><span><b>Simulación</b> · Hoy es ${fmt(now)}</span><span class="row"><button class="soft sm" data-days="1">+1 día</button><button class="soft sm" data-days="7">+7 días</button></span></div>`;
}
function bindSim(){ document.querySelectorAll("[data-days]").forEach(b => b.onclick = () => { now = addD(now, +b.dataset.days); tick(); route(); }); }
function suspBanner(){
  return suspended() ? `<div class="susp"><b>Cuenta suspendida hasta el ${fmt(me.suspendedUntil)}</b><br>No respondiste a una carta a tiempo. Mientras dure no puedes hacer nuevos matches.</div>` : "";
}

function descubrir(){
  const left = pending();
  const head = `<h2>Descubrir</h2><p class="sub">Primero los intereses. La foto, después del match.</p>${suspBanner()}`;
  if (!plus && viewsLeft()<=0){
    $("#view").innerHTML = head + `<div class="paywall"><b>Ya has visto tus ${VIEW_LIMIT} perfiles de hoy</b><p>Mañana podrás ver ${VIEW_LIMIT} más. Si quieres conocer a más personas ahora, suscríbete a Remitee Plus.</p><button id="sub">Suscribirme a Remitee Plus</button><small>Simulación: no se cobra nada.</small></div>${sim()}`;
    bindSim(); $("#sub").onclick = () => { plus = true; toast("Ya eres de Remitee Plus: perfiles ilimitados"); descubrir(); }; return;
  }
  if (!left.length){ $("#view").innerHTML = head + `<div class="empty">Has visto todos los perfiles disponibles.<br>Vuelve pronto: llegan personas nuevas.</div>${sim()}`; bindSim(); return; }
  const p = left[0];
  const shared = common(p);
  $("#view").innerHTML = head + `
    <div class="views">${plus?"Remitee Plus · perfiles ilimitados":`Perfil ${viewsUsed+1} de ${VIEW_LIMIT} hoy`}${plus?"":`<span class="vbar">${Array.from({length:VIEW_LIMIT},(_,i)=>`<i class="${i<viewsUsed?"used":i===viewsUsed?"now":""}"></i>`).join("")}</span>`}</div>
    <article class="card">
      <div>${photo(p,"big",false)}<div class="phnote">${p.showFoto?"La foto se muestra si hay match":"Ha elegido no mostrar foto"}</div></div>
      <div><p class="name">${esc(p.alias)}</p><div class="where">${esc(p.prof)}</div><div class="where">${esc(p.edad)} años · Escribe desde ${esc(p.zona)}</div></div>
      <p class="bio">${esc(p.bio)}</p>
      <div class="chips">${p.tags.map(t=>`<span class="chip ${shared.includes(t)?"on":""}">${esc(t)}</span>`).join("")}</div>
      <div class="common">${shared.length?`${shared.length} ${shared.length===1?"interés":"intereses"} en común`:"Ningún interés en común, aún puede sorprenderte"}</div>
      <div class="actions"><button class="plain" id="no">Pasar</button><button id="yes" ${suspended()?"disabled":""}>Quiero escribirle</button></div>
    </article>
    <p class="hint">Si los dos os elegís, se abre la correspondencia y tendrás ${FIRST_DAYS} días para enviar la primera carta.</p>${sim()}`;
  bindSim();
  const used = () => { if (!plus) viewsUsed++; p.seen = true; };
  $("#no").onclick = () => { used(); descubrir(); };
  $("#yes").onclick = () => {
    used();
    if (p.likesMe){ chats.unshift({p, letters:[], unread:true, turn:"me", deadline:addD(now, FIRST_DAYS), closed:null}); badge(); match(p); }
    else { toast(`Si ${p.alias} también te elige, os avisaremos`); }
    descubrir();
  };
}

function match(p){
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="modal" role="dialog" aria-label="Match">
    <div class="pair">${myPhoto("md")}${photo(p,"md",true)}</div>
    <h3>¡Es mutuo!</h3>
    <p style="margin:0;color:var(--muted)">Tú y ${esc(p.alias)} queréis escribiros. ${p.showFoto?"Ya podéis ver vuestras fotos y vuestras biografías completas.":`${esc(p.alias)} prefiere no mostrar foto, pero ya puedes leer su biografía completa.`} Tienes <b>${FIRST_DAYS} días</b> para enviar la primera carta y marcarla en la app.</p>
    <button id="go">Abrir correspondencia</button><button class="plain" id="later">Más tarde</button></div>`;
  document.body.appendChild(o);
  o.querySelector("#go").onclick = () => { o.remove(); openId = p.id; location.hash = "#cartas"; route(); };
  o.querySelector("#later").onclick = () => o.remove();
}

function lastLine(c){
  if (c.closed==="me") return "Cerrada · no respondiste a tiempo";
  if (c.closed==="them") return `Cerrada · ${c.p.alias} no respondió a tiempo`;
  const d = daysLeft(c.deadline);
  if (!c.letters.length) return `Envía la primera carta · quedan ${d} días`;
  if (c.turn==="me") return `Te toca escribir · quedan ${d} días`;
  const l = c.letters[c.letters.length-1];
  return now >= l.arrive ? `Tu carta ha llegado · le toca a ${c.p.alias}` : `Tu carta va en camino`;
}

function cartas(){
  if (openId){ return ventana(chats.find(c => c.p.id === openId)); }
  $("#view").innerHTML = `<h2>Cartas</h2><p class="sub">Tus correspondencias abiertas.</p>${suspBanner()}` + (chats.length
    ? `<div class="list">${chats.map(c=>{ const urgent = !c.closed && c.turn==="me" && daysLeft(c.deadline)<=2;
        return `<button class="item ${c.closed?"closed":""}" data-id="${c.p.id}">${photo(c.p,"sm",true)}<div class="txt"><div class="n">${esc(c.p.alias)}</div><div class="s ${urgent?"urgent":""}">${esc(lastLine(c))}</div></div>${c.unread?'<span class="dot" aria-label="Novedad"></span>':""}</button>`; }).join("")}</div>`
    : `<div class="empty">Aún no tienes correspondencias.<br>Cuando haya un match mutuo, aparecerá aquí.</div>`) + sim();
  document.querySelectorAll(".item").forEach(b => b.onclick = () => { openId = +b.dataset.id; cartas(); });
  bindSim();
}

function deadlineBox(c){
  if (c.closed==="me") return `<div class="dl bad"><b>Correspondencia cerrada</b>No enviaste tu carta a tiempo. Tu cuenta ha quedado suspendida ${SUSPEND_DAYS} días.</div>`;
  if (c.closed==="them") return `<div class="dl bad"><b>Correspondencia cerrada</b>${esc(c.p.alias)} no respondió en el plazo de ${REPLY_DAYS} días. Su cuenta queda suspendida. Tú no pierdes nada.</div>`;
  const d = daysLeft(c.deadline);
  if (c.turn==="me"){
    const first = !c.letters.length;
    return `<div class="dl ${d<=2?"warn":"mine"}"><b>${first?"Envía la primera carta":"Te toca escribir"}</b>Quedan ${d} ${d===1?"día":"días"}, hasta el ${fmt(c.deadline)}. Si no la envías a tiempo, la correspondencia se cierra y tu cuenta queda suspendida ${SUSPEND_DAYS} días.</div>`;
  }
  const l = c.letters[c.letters.length-1];
  return `<div class="dl them"><b>Le toca a ${esc(c.p.alias)}</b>${now>=l.arrive?`Tu carta ya ha llegado. Tiene hasta el ${fmt(c.deadline)} para responder.`:`Tu carta llegará hacia el ${fmt(l.arrive)}. Después tendrá ${REPLY_DAYS} días para responder.`}</div>`;
}

function ventana(c){
  c.unread = false; badge();
  const canSend = !c.closed && c.turn==="me";
  $("#view").innerHTML = `<button class="back" id="back">← Cartas</button>
    <div class="chead">${photo(c.p,"md",true)}<div><div class="n">${esc(c.p.alias)}</div><div class="s">${esc(c.p.prof)} · ${esc(c.p.zona)} · ${c.letters.length} ${c.letters.length===1?"carta":"cartas"}</div></div></div>
    <details class="about" ${c.letters.length?"":"open"}><summary>Sobre ${esc(c.p.alias)}</summary>
      <div class="chips" style="margin:10px 0">${c.p.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>
      <p>${esc(c.p.long || c.p.bio)}</p><small>${esc(c.p.edad)} años · Escribe desde ${esc(c.p.zona)}</small></details>
    ${deadlineBox(c)}
    ${c.closed?"":(c.meReveal&&c.themReveal
      ? `<div class="sendto"><span class="lbl">Direcciones compartidas</span><span class="addr">Ya podéis escribiros directamente.</span><span class="addr"><b>${esc(c.p.alias)}:</b> dirección de ejemplo, ${esc(c.p.zona)}</span></div>`
      : `<div class="sendto"><span class="lbl">Escribe en el sobre</span><span class="addr">${esc(CENTRAL)}</span><span>Para: <span class="code">${esc(c.p.code)}</span></span><button class="linkbtn" id="howflow">¿Cómo funciona?</button></div>`)}
    <div class="timeline">${c.letters.length ? c.letters.map(l=>{ const arrived = now >= l.arrive;
      return `<div class="letter ${l.mine?"mine":""}"><div class="ic">✉︎</div><div><div class="t">${l.mine?"Tu carta":`Carta de ${esc(c.p.alias)}`}</div><div class="d">Enviada el ${fmt(l.at)}</div></div>
      ${l.mine?`<span class="status ${arrived?"ok":"way"}">${arrived?"Entregada":"En camino"}</span>`:`<span class="status ${arrived?"ok":"way"}">${arrived?"Recibida":"En camino"}</span>`}</div>`; }).join("")
      : `<div class="empty" style="padding:24px">Todavía no hay cartas.<br>Escribe la primera a mano y envíala a la dirección de arriba.</div>`}</div>
    ${c.closed?"":`<button class="bigbtn" id="sent" ${canSend?"":"disabled"}>${canSend?(c.letters.length?"Ya he enviado mi respuesta":"Ya he enviado la primera carta"):"Carta enviada ✓"}</button>
    <p class="note">${canSend?"Márcalo en cuanto eches la carta al buzón. Así se para tu plazo.":`Te avisaremos cuando ${esc(c.p.alias)} te responda.`}</p>`}
    ${c.closed||!c.letters.length?"":`<div class="share"><div><b>Compartir direcciones</b><small>${c.meReveal&&c.themReveal?"Hecho. Las cartas ya no pasan por nuestra oficina.":c.meReveal?`Esperando a que ${esc(c.p.alias)} también acepte.`:"Solo se comparten si los dos aceptáis. Nadie sabe si el otro ha dicho que no."}</small></div>
      ${c.meReveal&&c.themReveal?"":`<button class="${c.meReveal?"plain":"soft"} sm" id="share">${c.meReveal?"Retirar":"Aceptar"}</button>`}</div>`}
    ${sim()}`;
  $("#back").onclick = () => { openId = null; cartas(); };
  const hf = $("#howflow"); if (hf) hf.onclick = showFlow;
  const sh = $("#share"); if (sh) sh.onclick = () => { c.meReveal = !c.meReveal;
    if (c.meReveal && c.p.id in replyAfter && replyAfter[c.p.id] != null) setTimeout(() => { if (c.meReveal){ c.themReveal = true; toast(`${c.p.alias} también ha aceptado compartir direcciones`); if (openId===c.p.id) ventana(c); } }, 1800);
    if (!c.meReveal) c.themReveal = false; ventana(c); };
  bindSim();
  const btn = $("#sent"); if (!btn) return;
  btn.onclick = () => {
    const arrive = addD(now, POST_DAYS);
    c.letters.push({mine:true, at:now, arrive}); c.turn="them"; c.deadline = addD(arrive, REPLY_DAYS);
    const ra = c.p.id in replyAfter ? replyAfter[c.p.id] : 5; c.replyAt = ra==null ? null : addD(arrive, ra);
    toast(`Carta marcada como enviada a ${c.p.alias}`); ventana(c);
  };
}

function bindProfile(rerender){
  $("#f-p").onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { readForm(); me.foto = r.result; rerender(); toast("Foto subida. Solo se verá tras un match"); }; r.readAsDataURL(f); };
  $("#f-s").onchange = e => { me.showFoto = e.target.checked; };
}
function readForm(){
  me.alias = $("#f-a").value.trim() || me.alias; me.prof = $("#f-pr").value.trim(); me.edad = $("#f-e").value; me.zona = $("#f-z").value.trim();

/* ---- Animación: cómo viajan las cartas ---- */
const FLOW = [
  {from:0,to:1,txt:"Escribes tu carta y la envías a nuestra oficina, con el código de la otra persona."},
  {from:1,to:2,txt:"En la oficina la metemos en un sobre nuevo y la enviamos a su dirección."},
  {from:2,to:1,txt:"Su respuesta hace el mismo camino: primero llega a nuestra oficina…"},
  {from:1,to:0,txt:"…y de ahí, a tu buzón. Ninguno conoce la dirección del otro."},
  {from:0,to:2,direct:true,txt:"Cuando los dos decidáis compartir direcciones, ya podéis escribiros directamente."}
];
function flowHTML(){
  return `<div class="flow" aria-label="Cómo viajan las cartas">
  <svg viewBox="0 0 340 150" role="img" aria-hidden="true">
    <path class="fl-line" id="fl-l1" d="M58 92 H152"/><path class="fl-line" id="fl-l2" d="M188 92 H282"/>
    <path class="fl-arc" id="fl-arc" d="M40 70 Q170 -6 300 70"/>
    <g class="fl-node" transform="translate(40 92)"><circle r="22" class="fl-me"/><text y="5" class="fl-init">Tú</text></g>
    <g class="fl-node" id="fl-office" transform="translate(170 92)"><rect x="-22" y="-22" width="44" height="44" rx="10" class="fl-off"/>
      <path d="M-11 9 V-3 L0 -11 L11 -3 V9 Z M-4 9 V1 H4 V9" class="fl-house"/></g>
    <g class="fl-node" transform="translate(300 92)"><circle r="22" class="fl-them"/><text y="5" class="fl-init">L</text></g>
    <text x="40" y="134" class="fl-lbl">Tú</text><text x="170" y="134" class="fl-lbl">Oficina Remitee</text><text x="300" y="134" class="fl-lbl">Lince</text>
    <g id="fl-env"><rect x="-13" y="-9" width="26" height="18" rx="3" class="fl-envr"/><path d="M-12 -8 L0 1 L12 -8" class="fl-envf"/></g>
  </svg>
  <p class="fl-txt" id="fl-txt" aria-live="polite"></p>
  <div class="fl-dots">${FLOW.map((_,i)=>`<span data-i="${i}"></span>`).join("")}</div></div>`;
}
let flowRaf = 0;
function startFlow(root){
  cancelAnimationFrame(flowRaf);
  const X = [40,170,300], env = root.querySelector("#fl-env"), txt = root.querySelector("#fl-txt");
  const dots = [...root.querySelectorAll(".fl-dots span")], office = root.querySelector("#fl-office"), arc = root.querySelector("#fl-arc");
  const reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  const MOVE = 1800, HOLD = 1300, PH = MOVE + HOLD; let t0 = performance.now(), last = -1;
  const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
  function frame(now){
    if (!root.isConnected) return;
    const el = now - t0, i = Math.floor(el / PH) % FLOW.length, f = FLOW[i];
    const k = reduce ? 1 : ease(Math.min(1, (el % PH) / MOVE));
    const x = X[f.from] + (X[f.to]-X[f.from])*k, y = f.direct ? 70 - Math.sin(Math.PI*k)*42 : 70;
    env.setAttribute("transform", `translate(${x} ${y})`);
    if (i !== last){ last = i; txt.textContent = f.txt; dots.forEach((d,j)=>d.classList.toggle("on", j===i));
      office.classList.toggle("dim", !!f.direct); arc.classList.toggle("show", !!f.direct); }
    flowRaf = requestAnimationFrame(frame);
  }
  flowRaf = requestAnimationFrame(frame);
}
function showFlow(){
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="modal"><h3 style="font-size:1.25rem">¿Cómo funciona Remitee?</h3>${flowHTML()}<button id="fl-more">Saber más</button><button class="plain" id="fl-ok">Entendido</button></div>`;
  document.body.appendChild(o); startFlow(o);
  o.querySelector("#fl-ok").onclick = () => o.remove();
  o.querySelector("#fl-more").onclick = () => { o.remove(); location.hash = "#como"; };
}

/* ---- Tutorial de alta: un pop-up por paso ---- */
let wStep = 0;
const W = [
  {t:"Pon tu alias", d:"Es el nombre con el que te conocerán. No hace falta que sea el real.",
   f:()=>`<div class="field"><label for="w-a">Alias</label><input id="w-a" maxlength="24" value="${esc(me.alias)}" placeholder="Por ejemplo, Tinta Azul"></div>

     <label class="agecheck" for="w-25"><input type="checkbox" id="w-25" ${me.over25?"checked":""}><span>Confirmo que tengo 25 años o más</span></label>
     <div class="field"><label for="w-z">Escribes desde</label><input id="w-z" value="${esc(me.zona)}" placeholder="Región o provincia"></div>

     return !me.alias ? "Escribe un alias para continuar" : !me.over25 ? "Remitee es solo para mayores de 25 años" : !me.zona ? "Indica desde dónde escribes" : ""; }},
  {t:"Añade tu foto si quieres", d:"Nadie la verá antes del match. También puedes añadirla más adelante desde tu perfil.", skip:"Más adelante",
   f:()=>`<div class="wphoto">${myPhoto("big")}<label class="filebtn" for="w-p">${me.foto?"Cambiar foto":"Elegir foto"}</label><input type="file" id="w-p" accept="image/*" hidden></div>
     <label class="switch" for="w-s"><span><b>Mostrar mi foto tras el match</b><small>Si lo desactivas, solo verán tu inicial.</small></span><input type="checkbox" id="w-s" ${me.showFoto?"checked":""}></label>`,
   bind:()=>{ $("#w-p").onchange = e => { const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ me.foto=r.result; wizard(); }; r.readAsDataURL(f); }; },
   save:()=>{ me.showFoto=$("#w-s").checked; return ""; }},
  {t:"Una breve biografía", d:"Para que las personas sepan cómo eres. Es lo primero que leerán en Descubrir, junto con tus 3 intereses.",
   f:()=>`<div class="field"><label for="w-b">Biografía breve</label><textarea id="w-b" rows="3" maxlength="200" placeholder="Escribo mejor de lo que hablo...">${esc(me.bio)}</textarea><small><span id="w-bc">${me.bio.length}</span>/200</small></div>
     <div class="field"><label for="w-i">3 intereses</label><input id="w-i" value="${esc(me.intereses)}" placeholder="cine, montaña, poesía"><small>Separados por comas. Sirven para hacer match.</small></div>`,
   bind:()=>{ $("#w-b").oninput = e => $("#w-bc").textContent = e.target.value.length; },
   save:()=>{ me.bio=$("#w-b").value.trim(); me.intereses=$("#w-i").value.split(",").map(x=>x.trim()).filter(Boolean).slice(0,3).join(", ");
     return !me.bio ? "Escribe una biografía breve" : me.intereses.split(",").filter(Boolean).length<3 ? "Añade 3 intereses separados por comas" : ""; }},
  {t:"Una biografía extensa", d:"Solo la leerán las personas con las que hagas match. Cuéntate con calma: qué haces, qué te gusta, qué buscas.",
   f:()=>`<div class="field"><label for="w-l">Biografía extensa</label><textarea id="w-l" rows="6" maxlength="800" placeholder="Cuéntate con más calma...">${esc(me.long)}</textarea><small><span id="w-lc">${me.long.length}</span>/800</small></div>`,
   bind:()=>{ $("#w-l").oninput = e => $("#w-lc").textContent = e.target.value.length; },
   save:()=>{ me.long=$("#w-l").value.trim(); return ""; }},
  {t:"Tu dirección", d:"Es imprescindible. Nadie tiene acceso a ella: nosotros la usamos solo para reenviarte las cartas que te escriban.",
   f:()=>`<div class="field"><label for="w-d">Dirección postal</label><textarea id="w-d" rows="3" placeholder="Calle, número, piso&#10;Código postal y ciudad">${esc(me.dir||"")}</textarea></div>
     <div class="lockline">🔒 Las otras personas solo verán tu código de buzón, nunca tu dirección.</div>`,
   save:()=>{ me.dir=$("#w-d").value.trim(); return me.dir.length<8 ? "La dirección es imprescindible para recibir cartas" : ""; }}

function wizard(){
  const st = W[wStep], last = wStep === W.length-1;
  $("#view").innerHTML = `<div class="wbg"><div class="verified"><span class="vdot">✓</span><div><b>Cuenta verificada</b><small>${esc(me.email)}</small></div></div><h2>Crea tu perfil</h2><p class="sub">Te guiamos en 5 pasos.</p></div>`;
  document.querySelector(".overlay.wiz")?.remove();
  const o = document.createElement("div"); o.className = "overlay wiz";
  o.innerHTML = `<div class="modal wmodal" role="dialog" aria-labelledby="wt">
    <div class="wtop"><span class="wstep">Paso ${wStep+1} de ${W.length}</span><div class="wbar"><span style="width:${(wStep+1)/W.length*100}%"></span></div></div>
    <h3 id="wt">${st.t}</h3><p class="wdesc">${st.d}</p>
    <div class="wfields">${st.f()}</div>
    <div class="wbtns">${wStep>0?`<button class="plain" id="wb">Atrás</button>`:"<span></span>"}
      <span class="row">${st.skip?`<button class="soft" id="wsk">${st.skip}</button>`:""}<button id="wn">${last?"Crear perfil":"Siguiente"}</button></span></div></div>`;
  document.body.appendChild(o);
  st.bind && st.bind();
  const first = o.querySelector("input:not([type=file]):not([type=checkbox]),textarea"); if (first) first.focus();
  const go = n => { const err = st.save(); if (n>0 && err){ toast(err); return; } wStep += n; wizard(); };
  o.querySelector("#wn").onclick = () => { const err = st.save(); if (err){ toast(err); return; }
    if (!last){ wStep++; wizard(); return; }
    o.remove(); me.created = true; me.code = me.code || newCode(); saveMe(); altaStep = 1; wStep = 0; location.hash = "#descubrir"; route(); toast(`Perfil creado. Tu código de buzón es ${me.code}`); };
  const sk = o.querySelector("#wsk"); if (sk) sk.onclick = () => { st.save(); wStep++; wizard(); };
  const bk = o.querySelector("#wb"); if (bk) bk.onclick = () => { st.save(); wStep--; wizard(); };
  o.addEventListener("keydown", e => { if (e.key==="Enter" && e.target.tagName==="INPUT") { e.preventDefault(); o.querySelector("#wn").click(); } });
}

function como(){

const views = {descubrir, cartas, perfil, como};
function route(){
  const onb = !me.created; document.querySelector(".tabs").hidden = onb; $("#helpBtn").hidden = onb;
  if (onb){ alta(); window.scrollTo(0,0); return; }
  const v = (location.hash || "#descubrir").slice(1), name = views[v] ? v : "descubrir";
  if (name !== "cartas") openId = null;
  document.querySelectorAll(".tabs a").forEach(a => a.dataset.v===name ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  views[name](); window.scrollTo(0,0);
}
document.querySelector('.tabs a[data-v="cartas"]').addEventListener("click", () => { openId = null; if (location.hash==="#cartas") route(); });
window.addEventListener("hashchange", route);
// Tema: claro por defecto, botón para pasar a oscuro.
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  const b = $("#themeBtn"); b.innerHTML = t==="dark" ? SUN : MOON;
  b.setAttribute("aria-label", t==="dark" ? "Cambiar a modo claro" : "Cambiar a modo oscuro");
  try { localStorage.setItem("remitee-theme", t); } catch(e) {}
}
let saved = null; try { saved = localStorage.getItem("remitee-theme"); } catch(e) {}
setTheme(saved === "dark" ? "dark" : "light");
$("#helpBtn").onclick = showFlow;
$("#themeBtn").onclick = () => setTheme(document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark");
route();
</script>
