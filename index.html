<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#5b6cf0">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="emails/welcome.js"></script>
<title>Remitee</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
html{color-scheme:light}body{margin:0}[hidden]{display:none!important}
/* Layout: una sola columna estrecha tipo app móvil, barra de pestañas fija abajo, mucho aire y un único acento suave. */
:root{
  --bg:#f7f8fc; --surface:#ffffff; --ink:#22263a; --muted:#6b7186; --line:#eceef5;
  --tint1:#ffe3d6; --tint2:#dfe9ff; --tint3:#dff5e8; --tint4:#f3e1fb; --tint5:#fff1c9; --on-tint:#2a2e45;
  --on-accent:#fff; --accent:#5b6cf0; --accent-soft:#eceefe; --ok:#2fa36b; --ok-soft:#e5f6ee; --warm:#d98a1e; --warm-soft:#fdf2e4; --bad:#d64c4c; --bad-soft:#fdeaea; --sky:#2f8fb5; --sky-soft:#e3f3f9; --tick:#1d8cf0; --on-tick:#fff;
  --head:"Outfit", "Segoe UI", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141c; --surface:#1b1e29; --ink:#eceef6; --muted:#878ca3; --line:#272b3a;
  --tint1:#4d3a35; --tint2:#33405f; --tint3:#2d4a3c; --tint4:#47375a; --tint5:#4d4330; --on-tint:#eceef6;
  --on-accent:#12141c; --accent:#8d99ff; --accent-soft:#252a4a; --ok:#5cc792; --ok-soft:#1d3329; --warm:#f2b46a; --warm-soft:#3a2e1f; --bad:#f08080; --bad-soft:#3b2224; --sky:#6cc3e3; --sky-soft:#1b2f38; --tick:#4aa8ff; --on-tick:#0d1420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141c; --surface:#1b1e29; --ink:#eceef6; --muted:#878ca3; --line:#272b3a;
  --tint1:#4d3a35; --tint2:#33405f; --tint3:#2d4a3c; --tint4:#47375a; --tint5:#4d4330; --on-tint:#eceef6;
  --on-accent:#12141c; --accent:#8d99ff; --accent-soft:#252a4a; --ok:#5cc792; --ok-soft:#1d3329; --warm:#f2b46a; --warm-soft:#3a2e1f; --bad:#f08080; --bad-soft:#3b2224; --sky:#6cc3e3; --sky-soft:#1b2f38; --tick:#4aa8ff; --on-tick:#0d1420; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
.app{max-width:440px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding-block:22px 18px}
.logo{font-family:var(--head);font-weight:700;font-size:1.45rem;letter-spacing:-.02em;margin:0}
.logo a{color:inherit;text-decoration:none}
.logo span{color:var(--accent)}

.logo .slogan{display:block;font-family:var(--body);font-size:.68rem;font-weight:500;letter-spacing:.02em;color:var(--muted);margin-top:-2px}
.theme-btn{width:38px;height:38px;padding:0;border-radius:50%;background:var(--surface);color:var(--ink);border:1px solid var(--line);display:grid;place-items:center}
.theme-btn svg{width:18px;height:18px}
.theme-btn,.helpbtn{position:relative}
.theme-btn::before,.helpbtn::before{content:"";position:absolute;inset:-4px;border-radius:50%}
.topr{display:flex;gap:10px;align-items:center}
.demo{font-size:.7rem;font-weight:500;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
h2{font-family:var(--head);font-weight:600;font-size:1.35rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px}
button{font-family:var(--body);font-weight:600;font-size:.95rem;border:0;border-radius:999px;padding:13px 20px;cursor:pointer;background:var(--accent);color:var(--on-accent);transition:transform .12s, opacity .12s}
button:active{transform:scale(.97)}
button.soft{background:var(--accent-soft);color:var(--accent)}
button.plain{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.avatar{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-weight:600;font-size:1.1rem;color:var(--ink)}
.chip{font-size:.78rem;background:var(--bg);border:1px solid var(--line);padding:4px 11px;border-radius:999px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* Descubrir */
.card{background:var(--surface);border-radius:28px;padding:28px 24px 24px;box-shadow:0 10px 30px -18px rgba(40,50,110,.35);display:grid;gap:18px;text-align:center}
.card .avatar{width:84px;height:84px;font-size:1.7rem;margin:0 auto}
.card .name{font-family:var(--head);font-weight:600;font-size:1.4rem;margin:0}
.card .where{color:var(--muted);font-size:.85rem;margin-top:2px}
.card .bio{font-size:1rem;margin:0;color:var(--ink)}
.card .chips{justify-content:center}
.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.hint{color:var(--muted);font-size:.82rem;text-align:center;margin-top:14px}

/* Overlay match */
.overlay{position:fixed;inset:0;background:rgba(18,20,30,.45);display:grid;place-items:center;padding:20px;z-index:20}
.modal{background:var(--surface);border-radius:28px;padding:30px 24px;max-width:380px;width:100%;text-align:center;display:grid;gap:16px}
.pair{display:flex;justify-content:center}
.pair .avatar{width:68px;height:68px;font-size:1.4rem;border:4px solid var(--surface)}
.pair .avatar+.avatar{margin-left:-14px}
.modal h3{font-family:var(--head);font-weight:700;font-size:1.5rem;margin:0}

/* Lista de cartas */
.list{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.item{min-width:0}
.item{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:var(--r);padding:14px 16px;cursor:pointer;border:0;width:100%;text-align:left;color:var(--ink);font-weight:400}
.item .txt{flex:1;min-width:0}
.item .n{font-family:var(--head);font-weight:600;font-size:1.02rem}
.item .s{color:var(--muted);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.empty{background:var(--surface);border-radius:var(--r);padding:34px 22px;text-align:center;color:var(--muted)}

/* Ventana de correspondencia */
.back{background:none;color:var(--accent);padding:4px 0;margin-bottom:10px;font-weight:600}
.chead{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.chead .n{font-family:var(--head);font-weight:600;font-size:1.25rem}
.chead .s{color:var(--muted);font-size:.84rem}
.sendto{background:var(--surface);border-radius:var(--r);padding:18px;display:grid;gap:6px;margin-bottom:18px}
.sendto .lbl{font-size:.74rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sendto .addr{font-size:.93rem}
.sendto .code{font-family:ui-monospace,Menlo,monospace;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;display:inline-block;margin-top:2px}
.timeline{display:grid;gap:10px;margin-bottom:18px}
.letter{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:12px 14px;max-width:88%}
.letter.mine{margin-left:auto;background:var(--accent-soft)}
.letter .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--bg)}
.letter.mine .ic{background:var(--surface)}
.letter .t{font-weight:600;font-size:.9rem}
.letter .d{color:var(--muted);font-size:.8rem}
.status{font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;margin-left:auto;white-space:nowrap}
.status.way{background:var(--warm-soft);color:var(--warm)}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.bigbtn{width:100%;padding:16px;font-size:1rem}
.note{color:var(--muted);font-size:.82rem;text-align:center;margin-top:10px}

/* Perfil */
.form{display:grid;gap:14px}
.field{display:grid;gap:6px;background:var(--surface);border-radius:var(--r);padding:14px 16px}
.field label{font-size:.76rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input,textarea{font:inherit;color:var(--ink);background:transparent;border:0;padding:2px 0;width:100%;resize:vertical}
.field small{color:var(--muted);font-size:.8rem}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:10}
.tabs .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px}
.tabs a{display:grid;justify-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.74rem;font-weight:500;padding:6px;border-radius:12px;position:relative}
.tabs a[aria-current="page"]{color:var(--accent)}
.tabs svg{width:23px;height:23px}
.tabs a.tab-main{width:74px;margin-top:-30px;padding:0 0 4px;gap:5px}
.tabs a.tab-main svg{width:62px;height:62px;padding:16px;border-radius:50%;background:var(--accent);color:var(--on-accent);box-shadow:0 10px 24px -8px rgba(91,108,240,.65), 0 0 0 5px var(--surface);transition:transform .15s}
.tabs a.tab-main:active svg{transform:scale(.94)}
.tabs a.tab-main[aria-current="page"] svg{background:var(--accent)}
.tabs a.tab-main .tl{font-weight:600}
.disc-h{margin-bottom:14px}
.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--accent);color:var(--on-accent);font-size:.62rem;font-weight:600;min-width:17px;height:17px;border-radius:999px;display:grid;place-items:center;padding:0 4px}
/* Fotos */
.ph{flex:none;border-radius:50%;position:relative;overflow:hidden;display:grid;place-items:center;background-size:cover;background-position:center}
.ph.big{width:110px;height:110px;margin:0 auto}
.ph.md{width:68px;height:68px;border:4px solid var(--surface)}
.ph.sm{width:52px;height:52px}
.ph.locked::before{content:"";position:absolute;inset:-12px;background:inherit;filter:blur(14px)}
.ph .lock{position:relative;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;color:#2a2e45}
.ph .lock svg{width:17px;height:17px}
.ph .init{font-family:var(--head);font-weight:600;color:var(--on-tint);font-size:1.2rem;position:relative}
.ph.big .init{font-size:2rem}
.phnote{font-size:.78rem;color:var(--muted);margin-top:8px}
.common{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.photo-pick{display:flex;gap:14px;align-items:center}
.photo-pick input[type=file]{font-size:.85rem}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:14px 16px}
.switch b{font-weight:600;font-size:.95rem}
.switch small{display:block;color:var(--muted);font-size:.8rem}
.switch input{width:46px;height:26px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:23px}
.sim{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;padding:12px 14px;border:1px dashed var(--line);border-radius:16px;font-size:.84rem;color:var(--muted)}
.sim b{color:var(--ink);font-weight:600}
.sim .row{gap:6px}
html,body{overflow-x:clip}
button.sm{padding:7px 13px;font-size:.82rem}
.dl{border-radius:var(--r);padding:14px 16px;margin-bottom:14px;font-size:.88rem;display:grid;gap:3px}
.dl b{font-family:var(--head);font-weight:600;font-size:1rem}
.dl.mine{background:var(--accent-soft);color:var(--ink)} .dl.mine b{color:var(--accent)}
.dl.warn{background:var(--warm-soft);color:var(--ink)} .dl.warn b{color:var(--warm)}
.dl.them{background:var(--surface);color:var(--muted)} .dl.them b{color:var(--ink)}
.dl.bad{background:var(--bad-soft);color:var(--ink)} .dl.bad b{color:var(--bad)}
.susp{background:var(--bad-soft);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;font-size:.88rem}
.susp b{color:var(--bad)}
.item.closed{opacity:.6}
.item .s.urgent{color:var(--warm);font-weight:600}
.paywall{margin-top:16px;background:var(--surface);border-radius:var(--r);padding:20px;text-align:center;display:grid;gap:10px;border:1px solid var(--accent-soft)}
.paywall b{font-family:var(--head);font-weight:600;font-size:1.1rem}
.paywall p{margin:0;color:var(--muted);font-size:.9rem}
.paywall small{color:var(--muted);font-size:.75rem}
.about{background:var(--surface);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.about summary{cursor:pointer;font-family:var(--head);font-weight:600;font-size:1rem;list-style-position:inside}
.about p{margin:0 0 8px;font-size:.93rem}
.about small{color:var(--muted);font-size:.8rem}
.welcome{display:grid;gap:14px;text-align:center;padding-top:20px}
.welcome h2{font-size:1.7rem;line-height:1.2}
.perks{list-style:none;padding:0;margin:0 0 6px;display:grid;gap:8px;text-align:left;background:var(--surface);border-radius:var(--r);padding:16px 18px}
.perks li{padding-left:24px;position:relative;font-size:.92rem}
.perks li::before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:700}
button.google{background:var(--surface);color:var(--ink);border:1px solid var(--line);width:100%;padding:15px}
.gsim{background:var(--surface);border-radius:var(--r);padding:16px}
.gsim .field{padding:0;background:transparent}
.gsim input{border-bottom:1px solid var(--line);padding:8px 0}
.verified{display:flex;gap:12px;align-items:center;background:var(--ok-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.verified b{display:block;font-size:.92rem;color:var(--ok)}
.verified small{color:var(--muted);font-size:.8rem}
.vdot{width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.wmodal{text-align:left;gap:12px;max-height:calc(100% - 20px);overflow:auto}
.wtop{display:grid;gap:8px}
.wstep{font-size:.75rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.wbar{height:5px;background:var(--line);border-radius:999px;overflow:hidden}
.wbar span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.wdesc{margin:0;color:var(--muted);font-size:.92rem}
.wfields{display:grid;gap:10px}
.wfields .field{background:var(--bg)}
.wbtns{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.wphoto{display:grid;justify-items:center;gap:12px;padding:6px 0}
.filebtn{font-weight:600;font-size:.9rem;color:var(--accent);background:var(--accent-soft);padding:9px 16px;border-radius:999px;cursor:pointer}
.wfields .switch{background:var(--bg)}
.sel{font:inherit;color:var(--ink);background:transparent;border:0;padding:2px 0}
.lockline{font-size:.85rem;color:var(--ink);background:var(--ok-soft);border-radius:14px;padding:10px 12px}
.wbg{opacity:.5}
.flow{display:grid;gap:8px}
.flow svg{width:100%;height:auto;display:block}
.fl-line{stroke:var(--line);stroke-width:2;stroke-dasharray:4 5;fill:none}
.fl-arc{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 5;fill:none;opacity:0;transition:opacity .4s}
.fl-arc.show{opacity:.7}
.fl-me{fill:var(--accent)} .fl-them{fill:var(--tint1)}
.fl-init{font-family:var(--head);font-weight:600;font-size:13px;text-anchor:middle;fill:var(--on-tint)}
.fl-me + .fl-init{fill:var(--on-accent)}
.fl-off{fill:var(--accent-soft)} .fl-house{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
#fl-office{transition:opacity .4s} #fl-office.dim{opacity:.3}
.fl-lbl{font-size:11px;text-anchor:middle;fill:var(--muted);font-family:var(--body)}
.fl-envr{fill:var(--surface);stroke:var(--ink);stroke-width:1.6} .fl-envf{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.fl-txt{margin:0;min-height:3.1em;font-size:.92rem;text-align:center;color:var(--ink)}
.fl-dots{display:flex;justify-content:center;gap:6px}
.fl-dots span{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .3s,width .3s}
.fl-dots span.on{background:var(--accent);width:18px;border-radius:999px}
.flowcard{background:var(--surface);border-radius:var(--r);padding:14px 14px 12px}
.linkbtn{background:none;color:var(--accent);padding:4px 0 0;font-size:.85rem;justify-self:start}
.share{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.share b{font-weight:600;font-size:.95rem}
.share small{display:block;color:var(--muted);font-size:.8rem}
.agecheck{display:flex;gap:10px;align-items:center;font-size:.9rem;padding:4px 2px}
.agecheck input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.helpbtn{background:var(--accent-soft);color:var(--accent);padding:8px 13px;font-size:.8rem}
.art{display:grid;gap:4px;padding-bottom:10px}
.art-kicker{font-size:.74rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.art h2{font-size:1.6rem;margin-bottom:6px}
.art-lede{font-size:1.02rem;margin:0 0 14px;color:var(--ink)}
.art .flowcard{margin-bottom:10px}
.art h3{font-family:var(--head);font-weight:600;font-size:1.08rem;margin:18px 0 2px}
.art p{margin:0;color:var(--ink);max-width:62ch}
.code-inline{font-family:ui-monospace,Menlo,monospace;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:5px;font-size:.9em}
.views{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;color:var(--muted);margin-bottom:10px}
.vbar{display:flex;gap:4px}
.vbar i{width:18px;height:4px;border-radius:999px;background:var(--line)}
.vbar i.used{background:var(--muted)}
.vbar i.now{background:var(--accent)}
.backp{background:none;color:var(--accent);padding:4px 0;font-size:.85rem;font-weight:600}
.backp:disabled{color:var(--muted);opacity:.5}
.trust{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:.78rem}
.trust.sm{justify-content:flex-start;margin-top:4px}
.tcount{color:var(--ink);font-weight:500}
.tok{color:var(--ok);background:var(--ok-soft);padding:1px 8px;border-radius:999px;font-weight:500}
.tnew{color:var(--warm);background:var(--warm-soft);padding:1px 9px;border-radius:999px;font-weight:600}
.whofirst{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:.88rem;color:var(--muted);display:grid;gap:2px}
.whofirst b{color:var(--ink);font-family:var(--head);font-weight:600;font-size:.98rem}
.whofirst.me{background:var(--accent-soft);border-color:transparent} .whofirst.me b{color:var(--accent)}
.lcard{background:var(--surface);border-radius:16px;padding:12px 14px;display:grid;gap:10px;max-width:94%}
.lcard.mine{margin-left:auto;background:var(--accent-soft)}

<script>
const CENTRAL = "Remitee · Apartado 123 · 39080 Santander";
const me = {created:false, g:"n", email:"", verified:false, alias:"", edad:"30–35", zona:"", prof:"", code:"", bio:"", long:"", intereses:"", dir:"", foto:null, showFoto:true};
/* ---- Firebase: login real con Google y perfiles guardados en la nube ----
   Solo se activa en la web publicada cuando firebase-config.js tiene la configuración del proyecto.
   En la vista previa de claude.ai no hay Firebase y todo se simula en el navegador. */
const FB = (() => { try { if (window.firebase && window.REMITEE_FIREBASE && window.REMITEE_FIREBASE.apiKey){
  firebase.initializeApp(window.REMITEE_FIREBASE); return {auth:firebase.auth(), db:firebase.firestore()}; } } catch(e){ console.warn("Firebase:", e); } return null; })();
// Lo que ven los demás va en "profiles"; el email y la dirección, en "private", que solo puede leer su dueño.
const PUBLIC_FIELDS = ["alias","edad","zona","prof","bio","long","intereses","langs","g","showFoto","code","over25"];
async function cloudSave(){
  if (!FB || !me.uid) return;
  const pub = {}; PUBLIC_FIELDS.forEach(k => pub[k] = me[k] ?? null);
  pub.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
  if (!me.hasCreatedAt){ pub.createdAt = pub.updatedAt; me.hasCreatedAt = true; }
  // Cada documento se guarda por separado: si uno falla, los demás (y la foto) se guardan igualmente
  const jobs = [
    ["private", () => FB.db.collection("private").doc(me.uid).set({email:me.email||"", dir:me.dir||"", foto:me.foto||null, liked:me.liked||[], nEmail:me.nEmail!==false, nApp:me.nApp!==false, vSeen:!!me.vSeen}, {merge:true})],
    ["profiles", () => FB.db.collection("profiles").doc(me.uid).set(pub, {merge:true})],
    ["gallery", () => FB.db.collection("gallery").doc(me.uid).set({items:(me.gallery||[]).map(g => ({src:g.src, cap:g.cap||""}))})]
  ];
  const fails = [];
  for (const [name, run] of jobs){ try { await run(); } catch(e){ console.warn("cloudSave", name, e); fails.push({name, code:e && e.code}); } }
  if (fails.length){ const err = new Error("cloudSave"); err.fails = fails; throw err; }
}
// Email de bienvenida: se deja en la colección "mail" y la extensión Trigger Email de Firebase lo envía
async function queueWelcome(){
  if (!FB || !me.uid || !me.email || !window.welcomeEmail || me.welcomeSent) return;
  const m = window.welcomeEmail(lang, me.alias, me.code, location.origin + location.pathname, me.g);
  try {
    await FB.db.collection("mail").doc("welcome_" + me.uid).set({ to: me.email, message: { subject: m.subject, html: m.html, text: m.text }, uid: me.uid, kind: "welcome", createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    me.welcomeSent = true; saveLocal();
  } catch(e){ console.warn("Welcome email:", e); }
}
async function cloudLoad(uid){
  const [a, b] = await Promise.all([FB.db.collection("profiles").doc(uid).get(), FB.db.collection("private").doc(uid).get()]);
  if (!a.exists) return false;
  const pub = a.data(); delete pub.updatedAt; me.hasCreatedAt = !!pub.createdAt; delete pub.createdAt; delete pub.hidden; me.plus = !!pub.plus; delete pub.plus;
  const priv = b.exists ? b.data() : {};
  const cloudChats = priv.chats, cloudNow = priv.simNow; delete priv.chats; delete priv.simNow;
  if (!priv.foto) delete priv.foto;
  Object.assign(me, pub, priv, {uid, created:true});
  try { const g = await FB.db.collection("gallery").doc(uid).get(); if (g.exists) me.gallery = g.data().items || []; } catch(e){}
  loadLocalChats(); if (!chats.length && cloudChats) restoreChats({chats:cloudChats, now:cloudNow});
  saveLocal(); return true;
}
async function googleLogin(){
  const r = await FB.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
  const u = r.user; me.uid = u.uid; me.email = u.email; me.verified = !!u.emailVerified; me.provider = "google";
  return cloudLoad(u.uid);

const nameHTML = p => esc(p.alias) + (p.plus ? TICK() : "");

  const o = document.createElement("div"); o.className = "overlay";
  const on = isPlus();
  o.innerHTML = `<div class="modal plusm" role="dialog" aria-label="Remitee Plus"><div class="kicker">Remitee Plus</div>
    <h2>${on ? L("Ya eres de Remitee Plus","You're on Remitee Plus") : L("Escribe a más gente, con sello propio","Write to more people, with your own seal")}</h2>
    <ul class="plist"><li><b>${L("Perfiles ilimitados","Unlimited profiles")}</b><span>${L(`Sin el límite de ${VIEW_LIMIT} perfiles al día.`,`No limit of ${VIEW_LIMIT} profiles a day.`)}</span></li>
    <li><b>${L("Tick azul de perfil verificado","Blue verified tick")}</b><span>${L("Aparece junto a tu alias en Descubrir, en los matches y en las cartas.","Shown next to your alias in Discover, matches and letters.")}</span></li>
    <li><b>${L("Suscripción mensual","Monthly subscription")}</b><span>${L("Se renueva cada mes y puedes cancelarla cuando quieras.","Renews monthly and you can cancel any time.")}</span></li></ul>
    <div class="pprev">${esc(me.alias || L("Tu alias","Your alias"))}${TICK()}</div>
    ${on ? "" : FB ? `<p class="note">${L("Los pagos se abrirán muy pronto. Mientras tanto, la suscripción la activa el equipo de Remitee.","Payments open very soon. Meanwhile, the Remitee team activates the subscription.")}</p>` : `<button id="plusGo">${L("Suscribirme","Subscribe")}</button><small class="note">${L("Prototipo: no se cobra nada.","Prototype: nothing is charged.")}</small>`}
    <button class="soft" id="plusX">${L("Cerrar","Close")}</button></div>`;
  document.body.appendChild(o);
  const close = () => o.remove(); o.onclick = e => { if (e.target === o) close(); }; o.querySelector("#plusX").onclick = close;
  const go = o.querySelector("#plusGo"); if (go) go.onclick = () => { me.plus = true; saveLocal(); close(); toast(L("Ya eres de Remitee Plus: perfiles ilimitados y tick azul","You're on Remitee Plus: unlimited profiles and blue tick")); if (after) after(); };
}
function toPerson(uid, d){
  const tags = String(d.intereses||"").split(",").map(x => x.trim()).filter(Boolean).slice(0,3);
  return {id:"r_"+uid, uid, real:true, alias:d.alias||"—", edad:d.edad||"", zona:d.zona||"", prof:d.prof||"", bio:d.bio||"", long:d.long||"", tags,
    langs:(d.langs && d.langs.length) ? d.langs : ["es"], g:d.g||"n", plus:!!d.plus, showFoto:d.showFoto !== false, code:d.code||"", corr:d.corr||0, rAvg:d.rAvg||0, rN:d.rN||0,
    places:[], gallery:[], home:homeOf(d.zona), at:(d.updatedAt && d.updatedAt.toMillis) ? d.updatedAt.toMillis() : 0};
}
async function loadRealProfiles(){
  if (!FB || !me.uid || realLoading) return; realLoading = true;
  try {
    const snap = await FB.db.collection("profiles").orderBy("updatedAt","desc").limit(100).get();
    const reals = [];
    snap.forEach(doc => { const d = doc.data(); if (doc.id === me.uid || !d.alias || !d.bio || d.hidden) return; if (people.some(x => x.uid === doc.id)) return; const rp = toPerson(doc.id, d); if ((me.liked||[]).includes(doc.id)) { rp.seen = true; rp.myYes = now; } reals.push(rp); });
    // Los más recientes primero y, todos, por delante de los perfiles de ejemplo
    reals.sort((a,b) => b.at - a.at);
    people.unshift(...reals);
    realLoaded = true;
    await checkMutualLikes();
    // Si en pantalla hay un perfil de ejemplo, se sustituye por el real recién cargado
    if (reals.some(r => !r.seen) && (location.hash.replace("#","") in {"":1,"descubrir":1}) && me.created && !document.querySelector(".overlay")) descubrir();
  } catch(e){ console.warn("Perfiles reales:", e); }
  realLoading = false;
}
async function likeReal(p){
  const already = (me.liked||[]).includes(p.uid);
  p.myYes = now;
  if (!FB || !me.uid){ me.liked = [...new Set([...(me.liked||[]), p.uid])]; saveLocal(); toast(L(`Si ${p.alias} también te elige, os avisaremos`,`If ${p.alias} chooses you too, we'll let you know`)); return; }
  const wait = L(`Si ${p.alias} también te elige, os avisaremos`,`If ${p.alias} chooses you too, we'll let you know`);
  // 1) Guardar el «Quiero escribirle» (solo la primera vez: si ya existe, no se vuelve a escribir)
  if (!already){
    try {
      await FB.db.collection("likes").doc(me.uid + "_" + p.uid).set({from:me.uid, to:p.uid, at:firebase.firestore.FieldValue.serverTimestamp()});
    } catch(e){
      console.warn("like", e);
      const code = e && e.code;
      if (code === "permission-denied"){
        // Puede que ya existiera de otra sesión: si existe, seguimos como si nada
        try { const mine = await FB.db.collection("likes").doc(me.uid + "_" + p.uid).get(); if (!mine.exists) throw e; }
        catch(_){ return toast(FB.auth.currentUser && !FB.auth.currentUser.emailVerified
          ? L("Verifica tu email para poder elegir a otras personas.","Verify your email to choose other people.")
          : L("No se ha podido guardar tu elección. Revisa que las reglas de Firestore estén publicadas.","Couldn't save your choice. Check the Firestore rules are published.")); }
      } else return toast(L("No se ha podido guardar tu elección. Revisa tu conexión e inténtalo de nuevo.","Couldn't save your choice. Check your connection and try again."));
    }
    me.liked = [...new Set([...(me.liked||[]), p.uid])]; saveMe();
  }
  // 2) Comprobar si la otra persona ya te había elegido
  try {
    const back = await FB.db.collection("likes").doc(p.uid + "_" + me.uid).get();
    if (back.exists) realMatch(p, true); else toast(wait);
  } catch(e){ console.warn("like check", e); toast(wait); }
}
function realMatch(p, iFirst){
  if (p.matched) return; p.matched = true;
  chats.unshift({p, letters:[], unread:true, turn:iFirst?"me":"them", deadline:addD(now, FIRST_DAYS), closed:null}); badge();
  notify(`Match con ${p.alias}.`, `Match with ${p.alias}.`); matchModal(p, iFirst);
}
async function checkMutualLikes(){
  for (const uid of (me.liked||[])){
    const p = people.find(x => x.uid === uid); if (!p || p.matched) continue;
    try { const back = await FB.db.collection("likes").doc(uid + "_" + me.uid).get(); if (back.exists) realMatch(p, false); } catch(e){}
  }
}

function descubrir(){
  if (FB && me.uid && !realLoaded) loadRealProfiles();
  const left = pending();
  const head = `<h2 class="disc-h">${L("Descubrir","Discover")}</h2>${suspBanner()}`;
  if (!isPlus() && viewsLeft()<=0){
    $("#view").innerHTML = head + `${backBtn()}<div class="paywall"><b>${L(`Ya has visto tus ${VIEW_LIMIT} perfiles de hoy`,`You've seen your ${VIEW_LIMIT} profiles for today`)}</b><p>${L(`Mañana podrás ver ${VIEW_LIMIT} más. Si quieres conocer a más personas ahora, suscríbete a Remitee Plus.`,`Tomorrow you'll see ${VIEW_LIMIT} more. To meet more people now, subscribe to Remitee Plus.`)}</p><button id="sub">${L("Suscribirme a Remitee Plus","Subscribe to Remitee Plus")}</button><small>${L("Incluye perfiles ilimitados y el tick azul de perfil verificado.","Includes unlimited profiles and the blue verified tick.")}</small></div>${sim()}`;
    bindSim(); bindBack(); $("#sub").onclick = () => plusModal(descubrir); return;
  }
  if (!left.length){ $("#view").innerHTML = head + `<div class="empty">${L("Has visto todos los perfiles disponibles.<br>Vuelve pronto: llegan personas nuevas.","You've seen every available profile.<br>Come back soon: new people are joining.")}</div>${backBtn()}${sim()}`; bindSim(); bindBack(); return; }
  const p = left[0];
  const shared = common(p);
  $("#view").innerHTML = head + `
    <div class="views">${backBtn()}<span>${isPlus()?L("Remitee Plus · perfiles ilimitados","Remitee Plus · unlimited profiles"):L(`Perfil ${viewsUsed+1} de ${VIEW_LIMIT} hoy`,`Profile ${viewsUsed+1} of ${VIEW_LIMIT} today`)}</span>${isPlus()?"":`<span class="vbar">${Array.from({length:VIEW_LIMIT},(_,i)=>`<i class="${i<viewsUsed?"used":i===viewsUsed?"now":""}"></i>`).join("")}</span>`}</div>
    <article class="card swipe">
      <div class="sw-top">
        ${photo(p,"big",false)}
        <div class="sw-id"><p class="name">${nameHTML(p)}</p>
          <div class="where">${esc(p.edad)} ${L("años","years old")} · ${esc(p.zona)}</div>
          ${p.real ? "" : `<span class="exbadge">${L("Perfil de ejemplo","Example profile")}</span>`}</div>
      </div>
      <div class="chips">${p.tags.map(t=>`<span class="chip ${shared.includes(t)?"on":""}">${esc(t)}</span>`).join("")}</div>
      <div class="common">${shared.length?L(`${shared.length} ${shared.length===1?"interés":"intereses"} en común`,`${shared.length} ${shared.length===1?"interest":"interests"} in common`):L("Ningún interés en común, aún puede sorprenderte","No interests in common, but they may still surprise you")}</div>
      <details class="more" id="more"><summary>${L("Ver perfil completo","See full profile")}</summary>
        <div class="more-in">
          <div class="where">${esc(p.prof)}</div>
          <p class="bio">${esc(p.bio)}</p>
      ${langsHTML(p)}
      ${statsHTML(p.corr||0, p.places||[], p.rAvg, p.rN)}
      <div class="rate-row">${ratingHTML(p.rAvg, p.rN)}</div>
      <div class="trust">${trust(p)}</div>
      <div class="maplock">${LOCK}<span>${(p.gallery||[]).length ? L(`Su mapa de cartas y ${p.gallery.length} fotos de sus intereses se muestran cuando hay match`,`Their letter map and ${p.gallery.length} photos of their interests are shown once you match`) : L("Su mapa de cartas se muestra cuando hay match","Their letter map is shown once you match")}</span></div>
          <div class="phnote">${p.showFoto?L("La foto se muestra si hay match","The photo is shown if you match"):L("Ha elegido no mostrar foto","Has chosen not to show a photo")}</div>
        </div>
      </details>
      <div class="actions"><button class="plain" id="no">${L("Pasar","Pass")}</button><button id="yes" ${suspended()?"disabled":""}>${L("Quiero escribirle","I want to write")}</button></div>
    </article>
    <p class="hint">${L("Si los dos os elegís, hay match. Escribe primero quien completa el match.","If you both choose each other, it's a match. Whoever completes the match writes first.")}</p>${sim()}`;
  bindSim(); bindBack();
  const used = () => { if (!isPlus()) viewsUsed++; p.seen = true; };
  $("#no").onclick = () => { used(); passedStack.push(p); descubrir(); };
  $("#yes").onclick = () => {
    used();
    if (p.real){ likeReal(p); descubrir(); return; }
    if (p.likesMe){ p.matched = true; chats.unshift({p, letters:[], unread:true, turn:"me", deadline:addD(now, FIRST_DAYS), closed:null}); badge(); matchModal(p, true); }
    else { p.myYes = now; if (p.likesLater != null) p.matchAt = addD(now, p.likesLater); toast(L(`Si ${p.alias} también te elige, os avisaremos`,`If ${p.alias} chooses you too, we'll let you know`)); }
    descubrir();
  };
}

function matchModal(p, iFirst){
  document.querySelector(".overlay.mt")?.remove();
  const o = document.createElement("div"); o.className = "overlay mt";
  o.innerHTML = `<div class="modal" role="dialog" aria-label="Match">
    <div class="pair">${myPhoto("md")}<button type="button" class="phbtn" id="mtPh" aria-label="${L("Ampliar foto","Enlarge photo")}">${photo(p,"md",true)}</button></div>
    <h3>${L("¡Es mutuo!","It's mutual!")}</h3>
    <p style="margin:0;color:var(--muted)">${iFirst?L(`${esc(p.alias)} ya te había elegido.`,`${esc(p.alias)} had already chosen you.`):L(`${esc(p.alias)} también te ha elegido.`,`${esc(p.alias)} has chosen you too.`)} ${p.showFoto?L("Ya podéis ver vuestras fotos y biografías completas.","You can now see each other's photos and full bios."):L(`${esc(p.alias)} prefiere no mostrar foto, pero ya puedes leer su biografía completa.`,`${esc(p.alias)} prefers not to show a photo, but you can now read their full bio.`)}</p>
    <div class="whofirst ${iFirst?"me":""}">${iFirst?`<b>${L("Te toca escribir primero","You write first")}</b>${L(`Has completado el match. Tienes ${FIRST_DAYS} días para enviar la primera carta.`,`You completed the match. You have ${FIRST_DAYS} days to send the first letter.`)}`:`<b>${L(`${esc(p.alias)} escribirá primero`,`${esc(p.alias)} will write first`)}</b>${L(`Ha completado el match. Tiene ${FIRST_DAYS} días para enviarte la primera carta.`,`They completed the match. They have ${FIRST_DAYS} days to send you the first letter.`)}`}</div>

  o.querySelector("#later").onclick = () => o.remove();
  o.querySelector("#mtPh").onclick = () => { const it = profilePhotoItem(p); if (it) openLightbox([it, ...(p.gallery||[])]); else if ((p.gallery||[]).length) openLightbox(p.gallery); };

/* ---- Contador circular del plazo (como un temporizador) ---- */
function ringInfo(c){
  if (c.closed || incoming(c)) return null;
  const d = daysLeft(c.deadline), hours = Math.max(0, (c.deadline - now) / 36e5);
  const mine = c.turn === "me";
  const total = c.letters.length ? REPLY_DAYS + (mine ? 2 : 5) : FIRST_DAYS;
  const frac = Math.max(0, Math.min(1, hours / 24 / total));
  const tone = !mine ? "them" : d <= 2 ? "warn" : "mine";
  return {d, frac, tone, mine};
}
function ringHTML(c, size = 44, opts = {}){
  const r = ringInfo(c); if (!r) return "";
  const R = 18, C = 2 * Math.PI * R;
  const label = r.mine ? L(`Te quedan ${r.d} ${r.d===1?"día":"días"}`,`${r.d} ${r.d===1?"day":"days"} left for you`) : L(`A ${c.p.alias} le quedan ${r.d} ${r.d===1?"día":"días"}`,`${c.p.alias} has ${r.d} ${r.d===1?"day":"days"} left`);
  const ring = `<span class="ring ${r.tone}" style="width:${size}px;height:${size}px" role="img" aria-label="${esc(label)}" title="${esc(label)}">
    <svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="${R}" class="rg-bg"/><circle cx="22" cy="22" r="${R}" class="rg-fg" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-r.frac)).toFixed(1)}" transform="rotate(-90 22 22)"/></svg>
    <span class="rg-n"><b>${r.d}</b><small>${L("d","d")}</small></span></span>`;
  return opts.cap ? `<span class="ringw">${ring}<span class="rg-cap" aria-hidden="true">${r.mine ? L("tu plazo","your time") : L(`plazo de ${esc(c.p.alias)}`,`${esc(c.p.alias)}'s time`)}</span></span>` : ring;
}

function lastLine(c){
  if (c.closed==="me") return L("Cerrada · no respondiste a tiempo","Closed · you didn't reply in time");
  if (c.closed==="them") return L(`Cerrada · ${c.p.alias} no escribió a tiempo`,`Closed · ${c.p.alias} didn't write in time`);
  const d = daysLeft(c.deadline), inc = incoming(c);
  if (inc) return L(`Carta de ${c.p.alias}`,`Letter from ${c.p.alias}`) + ` · ${PHASES()[stage(inc)].toLowerCase()}`;
  if (c.turn==="me") return c.letters.length ? L(`Te toca escribir · quedan ${d} días`,`Your turn to write · ${d} days left`) : L(`Escribes tú primero · quedan ${d} días`,`You write first · ${d} days left`);
  if (!c.letters.length) return L(`${c.p.alias} escribe primero`,`${c.p.alias} writes first`);
  const l = c.letters[c.letters.length-1];
  const k = stage(l);
  return L("Tu carta","Your letter") + ` · ${PHASES()[k].toLowerCase()} · ${fmt(phaseDate(l,k))}`;
}

/* ---- Estado de cada correspondencia, con color ---- */
function chatState(c){
  if (c.closed) return {k:"closed", t:L("Cerrada","Closed")};
  if (incoming(c)) return {k:"incoming", t:L("Carta en camino hacia ti","Letter on its way to you")};
  if (c.turn === "me") return daysLeft(c.deadline) <= 2 ? {k:"urgent", t:L("Se te agota el tiempo","Time is running out")} : {k:"mine", t:L("Te toca escribir","Your turn to write")};
  if (!c.letters.length) return {k:"waiting", t:L("Esperando su primera carta","Waiting for their first letter")};
  return {k:"sent", t:L(`Enviada · le toca a ${c.p.alias}`,`Sent · ${c.p.alias}'s turn`)};
}
const STATE_ORDER = {urgent:0, mine:1, incoming:2, sent:3, waiting:4, closed:5};
function legendHTML(){
  return `<div class="legend">${[["mine",L("Te toca","Your turn")],["urgent",L("Se agota el tiempo","Running out")],["sent",L("Enviada","Sent")],["incoming",L("En camino a ti","On its way")],["closed",L("Cerrada","Closed")]].map(([k,t])=>`<span class="lg-${k}"><i></i>${t}</span>`).join("")}</div>`;
}

function cartas(){
  if (openId != null){ const oc = chats.find(c => String(c.p.id) === String(openId)); if (oc) return ventana(oc); openId = null; }
  const sorted = [...chats].sort((a,b) => STATE_ORDER[chatState(a).k] - STATE_ORDER[chatState(b).k]);
  $("#view").innerHTML = `<h2>${L("Cartas","Letters")}</h2><p class="sub">${L("Tus correspondencias, ordenadas por lo que necesita tu atención.","Your correspondences, ordered by what needs your attention.")}</p>${suspBanner()}` + (chats.length
    ? `${legendHTML()}<div class="list">${sorted.map(c=>{ const st = chatState(c);
        return `<button class="item st-${st.k}" data-id="${c.p.id}">${photo(c.p,"sm",true)}<div class="txt"><div class="n">${nameHTML(c.p)}</div><span class="stpill">${st.t}</span><div class="s">${esc(lastLine(c))}</div></div>${ringHTML(c, 44, {cap:true})}${c.unread?`<span class="dot" aria-label="${L("Novedad","New")}"></span>`:""}</button>`; }).join("")}</div>`
    : `<div class="empty">${L("Aún no tienes correspondencias.<br>Cuando haya un match mutuo, aparecerá aquí.","You don't have any correspondences yet.<br>When you get a mutual match, it will appear here.")}</div>`) + sim();
  document.querySelectorAll(".item").forEach(b => b.onclick = () => { openId = b.dataset.id; cartas(); });
  bindSim();
}

function deadlineBox(c){
  const box = deadlineBoxInner(c), ring = ringHTML(c, 56);
  return ring ? box.replace(/^<div class="dl ([^"]*)">/, (m, cls) => `<div class="dl ${cls} has-ring">${ring}<div class="dl-t">`).replace(/<\/div>$/, "</div></div>") : box;
}
function deadlineBoxInner(c){
  if (c.closed==="me") return `<div class="dl bad"><b>${L("Correspondencia cerrada","Correspondence closed")}</b>${L(`No enviaste tu carta a tiempo. Tu cuenta ha quedado suspendida ${SUSPEND_DAYS} días.`,`You didn't send your letter in time. Your account has been suspended for ${SUSPEND_DAYS} days.`)}</div>`;
  if (c.closed==="them") return `<div class="dl bad"><b>${L("Correspondencia cerrada","Correspondence closed")}</b>${L(`${esc(c.p.alias)} no escribió en su plazo. Su cuenta queda suspendida. Tú no pierdes nada.`,`${esc(c.p.alias)} didn't write within their deadline. Their account is suspended. You lose nothing.`)}</div>`;
  const d = daysLeft(c.deadline), inc = incoming(c);
  if (inc) return `<div class="dl them"><b>${L(`${esc(c.p.alias)} te ha escrito`,`${esc(c.p.alias)} has written to you`)}</b>${L(`Su carta va de camino. Cuando te llegue tendrás ${REPLY_DAYS} días para responder.`,`Their letter is on its way. Once it arrives you'll have ${REPLY_DAYS} days to reply.`)}</div>`;
  if (c.turn==="me"){
    const first = !c.letters.length;
    return `<div class="dl ${d<=2?"warn":"mine"}"><b>${first?L("Te toca escribir primero","You write first"):L("Te toca escribir","Your turn to write")}</b>${first?L("Completaste el match. ","You completed the match. "):""}${L(`Quedan ${d} ${d===1?"día":"días"}, hasta el ${fmt(c.deadline)}. Si no la envías a tiempo, la correspondencia se cierra y tu cuenta queda suspendida ${SUSPEND_DAYS} días.`,`${d} ${d===1?"day":"days"} left, until ${fmt(c.deadline)}. If you don't send it in time, the correspondence closes and your account is suspended for ${SUSPEND_DAYS} days.`)}</div>`;
  }
  if (!c.letters.length) return `<div class="dl them"><b>${L(`${esc(c.p.alias)} escribe primero`,`${esc(c.p.alias)} writes first`)}</b>${L(`Completó el match, así que tiene hasta el ${fmt(c.deadline)} para enviarte la primera carta. Tú solo tienes que esperar.`,`They completed the match, so they have until ${fmt(c.deadline)} to send you the first letter. You just have to wait.`)}</div>`;
  const l = c.letters[c.letters.length-1], k = stage(l);
  return `<div class="dl them"><b>${L(`Le toca a ${esc(c.p.alias)}`,`${esc(c.p.alias)}'s turn`)}</b>${k===0?L(`Tu carta va camino de nuestra oficina y tu plazo queda en pausa hasta que llegue. ${esc(c.p.alias)} tiene hasta el ${fmt(c.deadline)} para responder.`,`Your letter is on its way to our office; your deadline is paused until it arrives. ${esc(c.p.alias)} has until ${fmt(c.deadline)} to reply.`):k<3?L("Tu carta ya está en nuestras manos. Plazo cumplido.","Your letter is in our hands. Deadline met."):L(`Tu carta ya ha llegado. Tiene hasta el ${fmt(c.deadline)} para responder.`,`Your letter has arrived. They have until ${fmt(c.deadline)} to reply.`)}</div>`;
}

function rateBox(c, l, i){
  if (l.mine || stage(l) < 3) return "";
  if (l.rated) return `<div class="ratebox done">${L("Tu valoración","Your rating")}: ${ratingHTML(l.rated, 1, {sm:true}).replace(/<span class="r-txt">.*?<\/span>/, `<span class="r-txt">${l.rated} ${L(l.rated===1?"sobre":"sobres",l.rated===1?"envelope":"envelopes")}</span>`)}</div>`;
  return `<div class="ratebox"><span>${L("Valora esta carta","Rate this letter")}</span><span class="rate-pick" role="group" aria-label="${L("De 1 a 5 sobres","From 1 to 5 envelopes")}">${[1,2,3,4,5].map(v=>`<button type="button" class="rp" data-rate="${i}" data-v="${v}" aria-label="${v} ${L(v===1?"sobre":"sobres",v===1?"envelope":"envelopes")}">${ENV_SVG}</button>`).join("")}</span></div>`;
}

function letterCard(c, l, i){
  const k = stage(l), isLast = i === c.letters.length-1, PH = PHASES();
  return `<div class="lcard ${l.mine?"mine":""}">

function startPrep(root){
  const box = root && root.querySelector(".prep"); if (!box) return;
  const scenes = [...box.querySelectorAll(".sc")], dots = [...box.querySelectorAll(".dotb")], txt = box.querySelector("#pp-txt");
  const prev = box.querySelector('[data-pp="-1"]'), next = box.querySelector('[data-pp="1"]');
  const P = PREP(); let i = 0;
  const label = () => L(`Paso ${i+1} de ${P.length}. `,`Step ${i+1} of ${P.length}. `) + P[i];
  const show = () => {
    scenes.forEach((s,j)=>s.classList.toggle("on", j===i)); dots.forEach((d,j)=>d.classList.toggle("on", j===i));
    txt.classList.add("fade"); setTimeout(() => { txt.textContent = label(); txt.classList.remove("fade"); }, 350);
    prev.disabled = i === 0; next.textContent = i === P.length-1 ? L("Volver a empezar","Start again") : L("Siguiente","Next");
  };
  prev.onclick = () => { if (i > 0){ i--; show(); } };
  next.onclick = () => { i = i === P.length-1 ? 0 : i+1; show(); };
  dots.forEach((d,j) => d.onclick = () => { i = j; show(); });
  txt.textContent = label(); show();
}

function saveLocal(){ try { localStorage.setItem("remitee-me", JSON.stringify(me)); } catch(e) { try { const c = {...me, foto:null}; localStorage.setItem("remitee-me", JSON.stringify(c)); if (!FB) toast(L("La foto es demasiado grande para guardarla. Prueba con otra.","The photo is too large to save. Try another one.")); } catch(_){} } }
let saving = Promise.resolve();
function saveMe(){ saveLocal(); if (!FB || !me.uid) return Promise.resolve(true);
  // Los guardados se encadenan para que uno antiguo no pise a uno nuevo
  saving = saving.catch(()=>{}).then(() => cloudSave()).then(() => true, e => { cloudError(e); return false; });
  return saving; }
function cloudError(e){
  const f = (e && e.fails) || [], denied = f.some(x => x.code === "permission-denied");
  const which = f.map(x => ({private:L("foto y datos privados","photo and private details"), profiles:L("perfil","profile"), gallery:L("galería","gallery")}[x.name] || x.name)).join(", ");
  toast(denied ? L(`No se ha podido guardar (${which}): faltan por publicar las reglas de Firestore.`,`Couldn't save (${which}): the Firestore rules need publishing.`)
               : L(`No se ha podido guardar en la nube (${which}). Revisa tu conexión.`,`Couldn't save to the cloud (${which}). Check your connection.`));
}
function loadMe(){ try { const d = JSON.parse(localStorage.getItem("remitee-me")||"null"); if (d) Object.assign(me, d); } catch(e) {} }

// Reduce la foto a 640 px en JPEG para que quepa guardada en el navegador y en la nube
function compressPhoto(file, max = 640, q = .82){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src = url;
  });
}

let flowRaf = 0;
function startFlow(root){
  cancelAnimationFrame(flowRaf);
  if (!root) return;
  const F = FLOW(), q = sel => root.querySelector(sel);
  const env = q("#fl-env"), txt = q("#fl-txt"); if (!env) return;
  const route = q("#fl-route"), direct = q("#fl-direct"), office = q("#fl-office"), offlbl = q("#fl-offlbl"), match = q("#fl-match");
  const A = q("#fl-a .fig-in"), B = q("#fl-b .fig-in"), heart = q("#fl-heart"), mline = q("#fl-mline");
  const dots = [...root.querySelectorAll(".fl-dots span")];
  const reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  const RL = route.getTotalLength(), DL = direct.getTotalLength(), ML = mline.getTotalLength();
  route.style.strokeDasharray = direct.style.strokeDasharray = "3 6";
  mline.style.strokeDasharray = ML; 
  const total = F.reduce((a,f) => a + f.t, 0);
  const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  const clamp = (v,a=0,b=1) => Math.max(a, Math.min(b, v));
  let t0 = performance.now(), last = -1;
  const setTxt = s => { txt.classList.add("fade"); setTimeout(() => { txt.textContent = s; txt.classList.remove("fade"); }, 260); };
  function frame(now){
    if (!root.isConnected || !env.isConnected) return;
    let el = reduce ? 0 : (now - t0) % total, i = 0;
    while (el > F[i].t){ el -= F[i].t; i++; }
    const f = F[i], k = el / f.t;
    if (i !== last){ last = i; setTxt(f.txt); dots.forEach((d,j) => d.classList.toggle("on", j===i)); }
    // Monigotes: en el match se acercan y se inclinan el uno hacia el otro
    const lean = f.k === "match" ? Math.sin(Math.PI * clamp(k*1.25)) : 0;
    A.setAttribute("transform", `translate(${(lean*10).toFixed(2)} ${(-Math.abs(Math.sin(now/380))*1.5*(f.k==="match"?1:.4)).toFixed(2)}) rotate(${(lean*8).toFixed(2)})`);
    B.setAttribute("transform", `translate(${(-lean*10).toFixed(2)} ${(-Math.abs(Math.sin(now/420+1))*1.5*(f.k==="match"?1:.4)).toFixed(2)}) rotate(${(-lean*8).toFixed(2)})`);
    match.style.opacity = f.k === "match" ? clamp(k*4) * (1 - clamp((k-.85)*7)) : 0;
    mline.style.strokeDashoffset = ML * (1 - ease(clamp(k*1.6)));
    const hk = clamp((k-.35)*3); heart.setAttribute("transform", `translate(170 50) scale(${(hk ? .6 + .4*ease(hk) + Math.sin(now/220)*.04*hk : 0).toFixed(3)})`);
    // Rutas
    const showRoute = f.k === "go" || f.k === "back" || f.k === "write";
    route.style.opacity = showRoute ? 1 : f.k === "direct" ? .15 : 0;
    office.style.opacity = offlbl.style.opacity = f.k === "direct" ? .25 : f.k === "match" ? .35 : 1;
    direct.style.opacity = f.k === "direct" ? 1 : 0;
    route.style.strokeDashoffset = -(now/40 % 9);
    // El sobre
    let pt = null, sc = 1, op = 1;
    if (f.k === "write"){ const pp = route.getPointAtLength(0); pt = {x:pp.x, y:pp.y - 10*(1-ease(clamp(k*1.4)))}; op = clamp(k*2); sc = .6 + .4*ease(clamp(k*1.4)); }
    else if (f.k === "go"){ pt = route.getPointAtLength(RL * ease(k)); }
    else if (f.k === "back"){ pt = route.getPointAtLength(RL * (1 - ease(k))); }
    else if (f.k === "direct"){ pt = direct.getPointAtLength(DL * ease(clamp(k*1.15))); }
    else op = 0;
    // Pausa breve en la oficina
    if ((f.k === "go" || f.k === "back") && Math.abs(k - .5) < .06) sc = 1.12;
    if (pt){ env.setAttribute("transform", `translate(${pt.x.toFixed(2)} ${pt.y.toFixed(2)}) scale(${sc.toFixed(3)})`); }
    env.style.opacity = op;
    flowRaf = requestAnimationFrame(frame);
  }
  txt.textContent = F[0].txt;
  flowRaf = requestAnimationFrame(frame);
}

    <button class="linkbtn" id="vout" style="justify-self:center">${L("Usar otra cuenta","Use another account")}</button>

  $("#vdone").onclick = async () => {

      if (had){ altaStep = 0; location.hash = "#descubrir"; route(); } else { altaStep = 2; alta(); } }

  };

    if (!FB) return toast(L(`Email reenviado a ${me.email}`,`Email resent to ${me.email}`));

  };

const ADMIN_EMAILS = ["iyanrojo@gmail.com"];
async function checkAdmin(){
  if (!FB || !me.uid) { me.admin = false; return; }
  let ok = ADMIN_EMAILS.includes(String(me.email||"").toLowerCase());
  if (!ok) { try { ok = (await FB.db.collection("admins").doc(me.uid).get()).exists; } catch(e){ ok = false; } }
  me.admin = ok; const b = $("#adminBtn"); if (b) b.hidden = !ok || !me.created;
}
let ADM = null, admTab = "resumen", admQ = "";
const tsMs = v => v && v.toMillis ? v.toMillis() : (typeof v === "number" ? v : 0);
async function loadAdmin(){
  const all = async c => { const out = {}; try { (await FB.db.collection(c).get()).forEach(d => out[d.id] = d.data()); } catch(e){ console.warn("admin", c, e); out.__err = true; } return out; };
  const [profiles, priv, likes] = await Promise.all([all("profiles"), all("private"), all("likes")]);
  const err = profiles.__err || priv.__err || likes.__err; delete profiles.__err; delete priv.__err; delete likes.__err;
  const users = Object.entries(profiles).map(([uid, d]) => {
    const p = priv[uid] || {};
    return {uid, alias:d.alias||"—", code:d.code||"", zona:d.zona||"", edad:d.edad||"", prof:d.prof||"", bio:d.bio||"", long:d.long||"", intereses:d.intereses||"", langs:d.langs||[], hidden:!!d.hidden, plus:!!d.plus,
      created:tsMs(d.createdAt), updated:tsMs(d.updatedAt), email:p.email||"", dir:p.dir||"", foto:p.foto||null, sent:0, got:0, matches:0, complete:!!(d.alias && d.bio)};
  });
  const byUid = Object.fromEntries(users.map(u => [u.uid, u]));
  const L2 = Object.values(likes).filter(l => l.from && l.to);
  const set = new Set(L2.map(l => l.from + "_" + l.to)), pairs = [];
  L2.forEach(l => { if (byUid[l.from]) byUid[l.from].sent++; if (byUid[l.to]) byUid[l.to].got++;
    if (l.from < l.to && set.has(l.to + "_" + l.from)) { pairs.push([l.from, l.to]); if (byUid[l.from]) byUid[l.from].matches++; if (byUid[l.to]) byUid[l.to].matches++; } });
  ADM = {users, byUid, likes:L2.length, pairs, err, at:Date.now()};
}

  document.querySelectorAll("[data-at]").forEach(b => b.onclick = () => { admTab = b.dataset.at; admin(); });
  document.querySelectorAll("#view [data-u]").forEach(el => { el.onclick = () => admUser(el.dataset.u); if (el.tagName === "TR") el.onkeydown = e => { if (e.key === "Enter") admUser(el.dataset.u); }; });
  const aq = $("#aq"); if (aq){ aq.oninput = () => { admQ = aq.value; const pos = aq.selectionStart; admin(); const n = $("#aq"); n.focus(); n.setSelectionRange(pos, pos); }; }
  const f = $("#acode"); if (f) f.onsubmit = e => { e.preventDefault(); const c = $("#acin").value.trim().toUpperCase(); const u = U.find(x => x.code.toUpperCase() === c);
    $("#acout").innerHTML = !c ? "" : u ? `<div class="aaddr"><div class="kicker">${L("Reenviar a","Forward to")}</div><b>${esc(u.alias)}</b> <code>${esc(u.code)}</code>${u.dir ? `<pre>${esc(u.dir)}</pre><button class="soft sm" id="acopy">${L("Copiar dirección","Copy address")}</button>` : `<p class="status way">${L("Esta persona no ha guardado su dirección.","This person hasn't saved an address.")}</p>`}</div>` : `<p class="hint">${L("Ningún perfil tiene ese código. Revisa el sobre o apártalo como carta sin código válido.","No profile has that code. Check the envelope or set it aside as a letter without a valid code.")}</p>`;
    const cp = $("#acopy"); if (cp) cp.onclick = () => { navigator.clipboard.writeText(u.dir).then(() => toast(L("Dirección copiada","Address copied")), () => toast(L("No se ha podido copiar","Couldn't copy"))); }; };
}
async function admUser(uid){
  const u = ADM.byUid[uid]; if (!u) return;
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="modal amodal" role="dialog" aria-label="${esc(u.alias)}">
    <div class="ahead">${u.foto ? `<img class="aph" src="${u.foto}" alt="">` : `<div class="aph">${esc(u.alias[0]||"?")}</div>`}<div><h3>${nameHTML(u)}</h3><small>${esc([u.prof,u.edad,u.zona].filter(Boolean).join(" · "))}</small></div></div>
    <dl class="adl"><dt>${L("Código","Code")}</dt><dd><code>${esc(u.code)}</code></dd><dt>Email</dt><dd>${esc(u.email||"—")}</dd><dt>${L("Dirección","Address")}</dt><dd>${u.dir ? esc(u.dir).replace(/\n/g,"<br>") : "—"}</dd>
    <dt>${L("Alta","Joined")}</dt><dd>${admDate(u.created || u.updated)}${u.created ? "" : " " + L("(aprox.)","(approx.)")}</dd><dt>${L("Elecciones","Choices")}</dt><dd>${u.sent} ${L("enviadas","sent")} · ${u.got} ${L("recibidas","received")} · ${u.matches} matches</dd>
    <dt>${L("Intereses","Interests")}</dt><dd>${esc(u.intereses||"—")}</dd><dt>${L("Biografía","Bio")}</dt><dd>${esc(u.bio||"—")}</dd>${u.long ? `<dt>${L("Biografía extensa","Long bio")}</dt><dd>${esc(u.long)}</dd>` : ""}</dl>
    <div id="agal"></div>
    <div class="arow"><button class="soft" id="aplus">${u.plus ? L("Quitar Remitee Plus","Remove Remitee Plus") : L("Activar Remitee Plus","Activate Remitee Plus")}</button><button class="${u.hidden ? "" : "soft"}" id="ahide">${u.hidden ? L("Volver a mostrar en Descubrir","Show again in Discover") : L("Ocultar en Descubrir","Hide from Discover")}</button><button class="soft" id="aclose">${L("Cerrar","Close")}</button></div></div>`;
  document.body.appendChild(o);
  o.onclick = e => { if (e.target === o) o.remove(); }; o.querySelector("#aclose").onclick = () => o.remove();
  o.querySelector("#aplus").onclick = async () => {
    try { await FB.db.collection("profiles").doc(uid).set({plus:!u.plus}, {merge:true}); u.plus = !u.plus; o.remove(); admin();
      toast(u.plus ? L(`${u.alias} ya tiene Remitee Plus y tick azul`,`${u.alias} now has Remitee Plus and the blue tick`) : L(`${u.alias} ya no tiene Remitee Plus`,`${u.alias} no longer has Remitee Plus`)); }
    catch(e){ toast(L("No se ha podido cambiar. Revisa que las reglas nuevas estén publicadas.","Couldn't change it. Check the new rules are published.")); } };
  o.querySelector("#ahide").onclick = async () => {
    try { await FB.db.collection("profiles").doc(uid).set({hidden:!u.hidden}, {merge:true}); u.hidden = !u.hidden; o.remove(); admin();
      toast(u.hidden ? L(`${u.alias} ya no aparece en Descubrir`,`${u.alias} no longer appears in Discover`) : L(`${u.alias} vuelve a aparecer en Descubrir`,`${u.alias} appears in Discover again`)); }
    catch(e){ toast(L("No se ha podido cambiar. Revisa que las reglas nuevas estén publicadas.","Couldn't change it. Check the new rules are published.")); } };
  try { const g = await FB.db.collection("gallery").doc(uid).get(); const items = g.exists ? (g.data().items||[]) : [];
    if (items.length) o.querySelector("#agal").innerHTML = `<div class="sechead">${L("Galería","Gallery")}</div><div class="agal">${items.map(it => `<img src="${it.src}" alt="${esc(it.cap||"")}" title="${esc(it.cap||"")}">`).join("")}</div>`; } catch(e){}
}
const views = {descubrir, cartas, perfil, como, admin};
function route(){
  const onb = !me.created; document.querySelector(".tabs").hidden = onb; $("#bellBtn").hidden = onb; $("#topLogin").hidden = !onb || altaStep !== 0; $("#adminBtn").hidden = onb || !me.admin; $("#adminBtn").setAttribute("aria-label", L("Administración","Admin")); $("#adminBtn").title = L("Administración","Admin");
  if (onb && location.hash === "#como"){ document.body.classList.remove("wide"); como(); window.scrollTo(0,0); return; }
  if (onb){ alta(); window.scrollTo(0,0); return; }
  document.body.classList.remove("wide");
  const v = (location.hash || "#descubrir").slice(1), name = views[v] && (v !== "admin" || me.admin) ? v : "descubrir";
  if (name !== "cartas") openId = null;
  document.querySelectorAll(".tabs a").forEach(a => a.dataset.v===name ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  views[name](); window.scrollTo(0,0);
}
document.querySelector('.tabs a[data-v="cartas"]').addEventListener("click", () => { openId = null; if (location.hash==="#cartas") route(); });
window.addEventListener("hashchange", route);
$("#adminBtn").onclick = () => { location.hash = "#admin"; };

/* ---- Textos fijos de la cabecera y las pestañas ---- */
function applyStatic(){
  document.documentElement.lang = lang;
  $(".slogan").textContent = L("Mensajería a fuego lento","Slow-cooked mail");
  $(".demo").textContent = L("Prototipo","Prototype"); $(".demo").hidden = !!FB;
  $("#topLogin").textContent = L("Entrar","Sign in");
  $("#helpBtn").innerHTML = `<span class="hl">${L("Cómo funciona","How it works")}</span><span class="hq" aria-hidden="true">?</span>`;
  $("#helpBtn").setAttribute("aria-label", L("Cómo funciona","How it works"));
  $("#bellBtn").setAttribute("aria-label", L("Avisos","Notifications"));
  const tabTxt = {descubrir:L("Descubrir","Discover"), cartas:L("Cartas","Letters"), perfil:L("Perfil","Profile")};
  document.querySelectorAll(".tabs a").forEach(a => { const t = a.querySelector(".tl"); if (t) t.textContent = tabTxt[a.dataset.v]; });
  const lb = $("#langBtn"); lb.textContent = lang==="en" ? "ES" : "EN"; lb.setAttribute("aria-label", lang==="en" ? "Cambiar a español" : "Switch to English");
}
function setLang(l){ lang = l; try { localStorage.setItem("remitee-lang", l); } catch(e){} document.querySelectorAll(".overlay").forEach(o => o.remove()); applyStatic(); setTheme(document.documentElement.getAttribute("data-theme")||"light"); route(); }

// Tema: claro por defecto, botón para pasar a oscuro.
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  const b = $("#themeBtn"); b.innerHTML = t==="dark" ? SUN : MOON;
  b.setAttribute("aria-label", t==="dark" ? L("Cambiar a modo claro","Switch to light mode") : L("Cambiar a modo oscuro","Switch to dark mode"));
  try { localStorage.setItem("remitee-theme", t); } catch(e) {}
}
let saved = null; try { saved = localStorage.getItem("remitee-theme"); } catch(e) {}
setTheme(saved === "dark" ? "dark" : "light");
applyStatic();
$("#helpBtn").onclick = showFlow;
$("#logoHome").onclick = e => { e.preventDefault(); document.querySelectorAll(".overlay").forEach(o => o.remove());
  if (me.created){ openId = null; if (location.hash === "#descubrir") route(); else location.hash = "#descubrir"; }
  else { altaStep = 0; wStep = 0; history.replaceState(null, "", location.pathname); route(); } window.scrollTo(0,0); };
$("#topLogin").onclick = () => { authMode = "login"; altaStep = 1; alta(); $("#topLogin").hidden = true; window.scrollTo(0,0); };
$("#bellBtn").onclick = showNotifs;
$("#langBtn").onclick = () => setLang(lang === "en" ? "es" : "en");
$("#themeBtn").onclick = () => setTheme(document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark");
if (me.created) loadLocalChats();
route();
</script>
